name: Deploy to MateServer

# PRODUCTION DEPLOYMENT — MANUAL ONLY.
#
# There is deliberately no `push:` trigger. A merge to main publishes images
# (see ci.yml) but never deploys. MateMail is not ready for MateServer: the Mail
# Engine does not exist yet (P4), mail policy is not enforced (P5), backups are
# simulated (P6) and there is no operational monitoring (P7). Per DEC-012, no
# real customer mail may reach the platform until all of P0–P7 are complete.
#
# Three independent gates stand between a merge and a running deployment:
#
#   1. workflow_dispatch only — a human starts it, on purpose.
#   2. `environment: production` — a required reviewer there holds the job for
#      approval. NOTE: environment protection rules need a paid plan on private
#      repos, so on the current plan this gate is present but not enforced.
#   3. `confirm` input — the operator must type the deployment target exactly.
#
# Removing any of these is a decision, not a cleanup.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (from a successful CI run). Not a branch name, not 'latest'."
        required: true
        type: string
      confirm:
        description: "Type MateServer to confirm you intend to deploy to production"
        required: true
        type: string

concurrency:
  # Never allow two deployments to interleave on the same host.
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_DIR: /opt/MateMail
  BACKEND_IMAGE: ghcr.io/rizwansammo/matemail-backend
  FRONTEND_IMAGE: ghcr.io/rizwansammo/matemail-frontend

jobs:

  gate:
    name: Confirm deployment intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "MateServer" ]; then
            echo "::error::Confirmation failed. Type exactly: MateServer"
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Verify the tag is a commit SHA
        run: |
          TAG="${{ inputs.image_tag }}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::image_tag must be a full 40-character commit SHA, not '$TAG'."
            echo "Production must name the exact image it runs so a rollback can name the one it returns to."
            exit 1
          fi
          echo "Deploying SHA $TAG"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate]

    # Configure a required reviewer on this environment in repo settings to add
    # a human approval step.
    #
    # NOTE (P2.5): environment protection rules are a paid feature for PRIVATE
    # repositories. On the current plan the environment exists but carries no
    # approval rule, so this is not an active gate. workflow_dispatch and the
    # `confirm` input are. Revisit if the repo becomes public or the plan changes.
    environment:
      name: production
      url: https://app.matemail.online

    # Least privilege: read the repo, read the packages this repo published.
    # GITHUB_TOKEN is scoped to this job and expires with it, so no long-lived
    # GHCR_TOKEN secret is needed. The packages are linked to this repository by
    # having been published from it, which is what makes `packages: read`
    # sufficient here.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Verify images exist in GHCR before touching the server
        run: |
          # Fail here rather than half-way through a deployment: if the tag was
          # never published, `docker compose pull` on the server would leave the
          # stack down with no image to fall back to.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in "${{ env.BACKEND_IMAGE }}" "${{ env.FRONTEND_IMAGE }}"; do
            echo "Checking $image:${{ inputs.image_tag }}"
            if ! docker manifest inspect "$image:${{ inputs.image_tag }}" > /dev/null 2>&1; then
              echo "::error::$image:${{ inputs.image_tag }} not found in GHCR. Run CI for that commit first."
              exit 1
            fi
          done
          echo "Both images present."

      - name: Deploy to MateServer
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail

            DEPLOY_DIR=/opt/MateMail
            BACKEND_IMAGE=ghcr.io/rizwansammo/matemail-backend
            FRONTEND_IMAGE=ghcr.io/rizwansammo/matemail-frontend

            cd "$DEPLOY_DIR"

            # No repository checkout exists here, and none is needed: the image
            # is the artifact. Only docker-compose.yml and .env live on the host.
            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: $DEPLOY_DIR/docker-compose.yml is missing."
              echo "Bootstrap the host once, per deploy/README.md."
              exit 1
            fi
            if [ ! -f .env ]; then
              echo "ERROR: $DEPLOY_DIR/.env is missing."
              exit 1
            fi

            # GHCR pull auth uses the host's existing docker login, per the
            # NetaMate production model. The workflow does not push a registry
            # credential to the server.
            if ! docker system info > /dev/null 2>&1; then
              echo "ERROR: docker is not usable by $(whoami)."
              exit 1
            fi

            # Back up the current .env so a rollback can restore the exact
            # image pair that was running.
            cp .env ".env.bak.$(date -u +%Y%m%dT%H%M%SZ)"
            ls -1t .env.bak.* 2>/dev/null | tail -n +11 | xargs -r rm --

            PREVIOUS_BACKEND=$(grep -E '^MATEMAIL_BACKEND_IMAGE=' .env | cut -d= -f2- || true)
            echo "Previous backend image: ${PREVIOUS_BACKEND:-none}"

            # Pin the new images.
            sed -i "s|^MATEMAIL_BACKEND_IMAGE=.*|MATEMAIL_BACKEND_IMAGE=${BACKEND_IMAGE}:${IMAGE_TAG}|" .env
            sed -i "s|^MATEMAIL_FRONTEND_IMAGE=.*|MATEMAIL_FRONTEND_IMAGE=${FRONTEND_IMAGE}:${IMAGE_TAG}|" .env
            grep -E '^MATEMAIL_(BACKEND|FRONTEND)_IMAGE=' .env

            echo "▸ Backing up the database before migrating..."
            docker compose exec -T postgres \
              pg_dump -U "${POSTGRES_USER:-matemail}" "${POSTGRES_DB:-matemail}" \
              | gzip > "/opt/MateMail/backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz" \
              || echo "WARNING: pre-deploy dump failed (first deploy, or postgres not yet running)"

            echo "▸ Pulling images..."
            docker compose pull

            echo "▸ Starting services..."
            # Migrations are MANDATORY on every production deployment and are
            # not optional. The compose stack runs them as a one-shot `migrate`
            # service whose successful completion gates backend, worker and beat
            # (`condition: service_completed_successfully`). A failed migration
            # therefore stops the deployment instead of starting code against a
            # stale schema.
            #
            # There is deliberately no `run_migrations` input: it existed, did
            # nothing, and setting it to false would have implied a skip that
            # could not happen. A control that does not control is worse than
            # no control.
            docker compose up -d --remove-orphans

            echo "▸ Waiting for backend health..."
            for i in $(seq 1 30); do
              if [ "$(docker compose ps --format json backend | grep -c '"Health":"healthy"')" -ge 1 ]; then
                echo "  backend healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: backend did not become healthy."
                docker compose ps
                docker compose logs --tail=80 backend migrate
                echo ""
                echo "To roll back: set MATEMAIL_*_IMAGE in $DEPLOY_DIR/.env to the"
                echo "previous SHA (backend was ${PREVIOUS_BACKEND:-unknown}) and re-run"
                echo "docker compose up -d."
                exit 1
              fi
              sleep 5
            done

            echo "▸ Verifying the public health endpoint..."
            curl -fsS http://127.0.0.1:8020/api/health/ | head -c 200
            echo ""

            docker compose ps

            # NO image prune here. MateServer is a shared production host
            # running NetaMate, TalkRoom, MateDesk, MateAssist, MateConnect and
            # Portfolio. `docker image prune` is host-global — it would delete
            # images belonging to applications this workflow has no business
            # touching, and a pruned image that another stack later needs to
            # recreate a container is an outage in someone else's service.
            #
            # Image cleanup belongs to MateServer's own maintenance process,
            # which can reason about every application on the host. Do not add
            # any host-global docker command to this workflow.
            echo "══ Deployment complete ══"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target | MateServer (\`${{ env.DEPLOY_DIR }}\`) |"
            echo "| SHA | \`${{ inputs.image_tag }}\` |"
            echo "| Triggered by | @${{ github.actor }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
