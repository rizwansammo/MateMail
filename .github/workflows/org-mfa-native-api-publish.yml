name: Publish Organization MFA Native API candidate

# Publishing is NOT deploying. A digest-pinned Native API release is a separate
# operator-approved rollout BEFORE the matching Hub/PostBox feature activation.
# Never modify the legacy :ne1 moving tag, the MateServer host, or customer data.
on:
  push:
    branches: [main]
    paths:
      - 'engine/native_api/**'
      - 'deploy/native-engine/images/api/**'
      - '.github/workflows/org-mfa-native-api-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: org-mfa-native-api-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish immutable Native API candidate
    if: github.repository == 'rizwansammo/MateMail' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SHA-tagged candidate without changing running services
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/native-engine/images/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rizwansammo/matemail-native-api:org-mfa-${{ github.sha }}
          cache-from: type=gha,scope=org-mfa-native-api
          cache-to: type=gha,mode=max,scope=org-mfa-native-api

      - name: Report production pin and strict deployment order
        env:
          CANDIDATE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_DIGEST" in
            sha256:*) ;;
            *) echo "::error::Image digest missing"; exit 1;;
          esac
          {
            echo '## Organization MFA Native API — published, NOT deployed'
            echo
            echo 'Pin the following immutable image in MateServer Native Engine .env:'
            echo
            echo '`ghcr.io/rizwansammo/matemail-native-api@'${CANDIDATE_DIGEST}'`'
            echo
            echo '1. Operator deploys Native API after DB backup and migration preflight.'
            echo '2. Verify schema v16, active mail protocol and Native API health.'
            echo '3. Operator separately deploys backend/frontend pinned to this commit.'
            echo '4. Verify configuration and recovery before enabling optional 2FA.'
            echo '5. The Organization Require gate remains OFF until independently accepted.'
            echo
            echo 'This workflow did not connect to or modify MateServer.'
          } >> "$GITHUB_STEP_SUMMARY"
