name: Release 3 dual report receivers backend image staging

# One time image staging after the guarded dual receiver change is merged.
# Never restart production services, mutate env, or change DNS here.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release3-report-receiver-stage.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: release3-report-backend-image
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'rizwansammo/MateMail' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify tested backend image is available from main CI
        env:
          IMAGE: ghcr.io/rizwansammo/matemail-backend:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null
          for attempt in $(seq 1 45); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo 'TESTED_IMAGE_AVAILABLE'
              exit 0
            fi
            sleep 15
          done
          echo 'Backend image did not become available. Nothing changed on MateServer.'
          exit 1

      - name: Pull verified backend image without deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: RELEASE_SHA,GHCR_TOKEN,GHCR_USER
          timeout: 60s
          command_timeout: 6m
          script: |
            set -Eeuo pipefail
            if ! [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            cleanup() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            unset GHCR_TOKEN
            image="ghcr.io/rizwansammo/matemail-backend:$RELEASE_SHA"
            docker pull "$image" >/dev/null
            docker image inspect "$image" --format 'STAGED_BACKEND {{.Id}}'
            echo 'NO_SERVICE_RESTARTED_NO_DNS_CHANGE_NO_ENV_MUTATION'
