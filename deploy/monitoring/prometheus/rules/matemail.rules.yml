# MateMail alert rules.
#
# WHY THE `for:` WINDOWS LOOK LIKE THIS
#   A container that restarts in two seconds must not page anybody. Every
#   availability rule therefore waits long enough to outlive a normal restart
#   or a deploy, and no longer. The exceptions are the security rules: a mail
#   port becoming publicly reachable is not something to sit on for five
#   minutes, so those fire almost immediately.
#
#   Thresholds that an operator may reasonably want to change live in one place
#   at the top of each group's comment rather than being scattered through
#   expressions.
#
# WHY SEVERITIES ARE ONLY warning/critical
#   Three levels invite a middle one that nobody routes anywhere. `critical`
#   means mail is affected or about to be; `warning` means look today.

groups:

  # ── Monitoring itself ───────────────────────────────────────────────────
  # If this group is quiet because the collector died, MonitoringCollectorStale
  # is the thing that says so. Everything else here depends on it being true.
  - name: monitoring
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }}. Metrics from it are stale, so every other alert that depends on it is now unreliable."

      - alert: MonitoringCollectorStale
        # The collector runs every 60s. Ten minutes without a completed run
        # means the numbers on the dashboards are no longer current.
        expr: time() - matemail_collector_last_run_timestamp_seconds > 600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "MateMail collector has not completed for 10 minutes"
          description: "Every matemail_* metric is frozen at its last value. Check: systemctl status matemail-collector.timer; journalctl -u matemail-collector.service"

      - alert: MonitoringCollectorSectionFailing
        expr: matemail_collector_section_ok == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Collector section {{ $labels.section }} is failing"
          description: "That section publishes no metrics while it fails, so anything it covers is unmonitored rather than healthy."

  # ── Native Engine ───────────────────────────────────────────────────────
  - name: native_engine
    rules:
      - alert: NativeServiceDown
        expr: matemail_native_service_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Native service {{ $labels.service }} is down"
          description: "A Native Engine component is not running. Mail flow is degraded or stopped."

      - alert: NativeServiceUnhealthy
        expr: matemail_native_service_healthy == 0 and matemail_native_service_up == 1
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Native service {{ $labels.service }} is running but unhealthy"
          description: "The container is up and failing its own healthcheck, which is the case container-status monitoring alone would miss."

      - alert: NativeEngineNotFullyHealthy
        # Deliberately separate from the per-service alerts: 9/10 is not
        # healthy, and this is the signal an operator should read as such.
        expr: matemail_native_all_healthy == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Native Engine is not fully healthy"
          description: "Some Native service is unhealthy. See matemail_native_service_healthy == 0 for which, and matemail_native_services_healthy vs matemail_native_services_expected for how many."

      - alert: NativeServiceRestartLoop
        expr: increase(matemail_native_service_restarts_total[30m]) > 3
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Native service {{ $labels.service }} is restarting repeatedly"
          description: "More than three restarts in thirty minutes. A crash loop can look healthy between restarts."

      - alert: NativeSchemaMismatch
        expr: matemail_native_schema_version_matches == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Native Engine schema version does not match the code"
          description: "The API requires a schema version the database does not have. Provisioning will fail."

      - alert: NativeApiDown
        expr: matemail_native_api_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Native API is unreachable"
          description: "MateMail's control plane provisions through this API. Domain and mailbox operations will fail."

  # ── MateMail application ────────────────────────────────────────────────
  - name: matemail_app
    rules:
      - alert: MateMailServiceDown
        expr: matemail_app_service_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "MateMail service {{ $labels.service }} is down"

      - alert: MateMailHealthEndpointFailing
        expr: matemail_app_health_up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "MateMail health endpoint is not answering"
          description: "Checked through the application itself, not container status: a backend whose database has gone is 'running' to Docker and useless to a customer."

      - alert: MateMailDependencyDown
        expr: matemail_app_dependency_up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "MateMail dependency {{ $labels.dependency }} is unavailable"

      - alert: CeleryWorkerDown
        expr: matemail_celery_workers_responding == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "No Celery worker is answering"
          description: "Background work including provisioning and email verification has stopped."

      - alert: CeleryBeatDown
        expr: matemail_celery_beat_up == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Celery beat is down; scheduled tasks are not running"

      - alert: CeleryBacklogGrowing
        expr: matemail_celery_queue_depth > 500
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Celery backlog is {{ $value }} tasks"

  # ── Mail flow: the group that matters most before NE6 ───────────────────
  # Before NE6 the Native Internet queue is normally EMPTY. These thresholds
  # are written for that expectation and should be revisited when real mail
  # starts flowing.
  - name: mail_flow
    rules:
      - alert: NativeQueueNonEmpty
        expr: matemail_native_queue_total > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Native mail queue has been non-empty for 30 minutes"
          description: "{{ $value }} messages queued. Before NE6 this queue is normally empty, so anything persisting here wants explaining."

      - alert: NativeQueueGrowing
        expr: delta(matemail_native_queue_total[15m]) > 50
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Native mail queue is growing fast"
          description: "Up {{ $value }} messages in fifteen minutes. Something downstream is refusing or failing."

      - alert: NativeDeferredQueueGrowing
        expr: matemail_native_queue_messages{queue="deferred"} > 25
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Deferred queue is {{ $value }} messages"
          description: "Deferrals mean temporary failures that keep being retried: DNS, a scanner failing closed, or a remote refusing."

      - alert: NativeQueuedMailTooOld
        expr: matemail_native_queue_oldest_age_seconds > 14400
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Oldest queued message is over four hours old"
          description: "Mail this old is close to being returned to its sender."

      - alert: NativeQuarantineAbnormal
        expr: matemail_native_quarantine_held > 20
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} messages held in quarantine"
          description: "Held mail waits for a human. A rising count usually means a scanner rule is catching more than intended."

      - alert: MailDeliveryFailureSpike
        expr: increase(matemail_postfix_events_total{event="bounced"}[1h]) > 25
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Bounces have risen sharply"
          description: "{{ $value }} bounces in the last hour."

      - alert: MailRejectionSpike
        expr: increase(matemail_postfix_events_total{event="rejected"}[1h]) > 100
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Rejections have risen sharply"

      - alert: AuthenticationFailureSpike
        # Aggregate only. No username reaches this metric, by construction.
        expr: increase(matemail_dovecot_events_total{event="auth_failed"}[15m]) > 50
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Unusual number of authentication failures"
          description: "{{ $value }} failed logins in fifteen minutes. Could be a password-spraying attempt or a broken client in a loop."

  # ── Scanners: these fail CLOSED, so their outage stops mail ─────────────
  - name: scanners
    rules:
      - alert: RspamdDown
        expr: matemail_rspamd_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Rspamd is not responding"
          description: "NE3 makes scanner failure defer mail rather than deliver it unscanned. Mail will queue."

      - alert: ClamAVDown
        expr: matemail_clamav_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "ClamAV is not responding"
          description: "NE3 defers mail when the virus scanner is unavailable, so this stops delivery rather than letting malware through."

      - alert: OlefyDown
        expr: matemail_olefy_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Olefy document scanner is down"

      - alert: ClamAVSignaturesStale
        # freshclam updates several times a day; two days means it has stopped.
        expr: matemail_clamav_signature_age_seconds > 172800
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "ClamAV signatures are {{ $value | humanizeDuration }} old"
          description: "A running scanner with stale definitions looks healthy and catches nothing new."

  # ── DNS ─────────────────────────────────────────────────────────────────
  - name: dns
    rules:
      - alert: UnboundDown
        expr: matemail_unbound_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Unbound is down; the mail engine cannot resolve anything"

      - alert: DnsResolutionFailing
        expr: matemail_dns_resolution_ok == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Unbound is not resolving known-good names"

      - alert: DnssecValidationLost
        # The NE1 property. A resolver that answers everything, including
        # forgeries, is worse than one that is down.
        expr: matemail_dnssec_validating == 0 or matemail_dnssec_rejects_invalid == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "DNSSEC validation is no longer working correctly"
          description: "Either signed answers are not being validated, or deliberately broken DNSSEC is being accepted. Both break the guarantee NE1 established."

      - alert: MailDnsIdentityDrift
        expr: matemail_dns_mx_correct == 0 or matemail_dns_a_correct == 0 or matemail_dns_ptr_correct == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "MX, A or PTR for the mail identity has drifted"
          description: "Reverse DNS and MX correctness decide whether mail is deliverable at all. Nothing in MateMail changes these, so drift means an external change."

      - alert: SenderPolicyRecordMissing
        expr: matemail_dns_spf_present == 0 or matemail_dns_dkim_present == 0 or matemail_dns_dmarc_present == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "SPF, DKIM or DMARC is missing for the sender domain"

      - alert: ProviderSpfAuthorizationBroken
        # A customer TXT containing include:_spf.matemail.pro can look
        # correct while the target is missing or stopped authorising our IP.
        # This is more serious than a missing marketing DNS TXT: it can make
        # SPF return PermError for every affected sending tenant.
        expr: matemail_dns_spf_provider_usable == 0 or matemail_dns_spf_sender_chain_usable == 0
        for: 20m
        labels: {severity: critical}
        annotations:
          summary: "MateMail provider SPF chain is broken"
          description: "The platform sender or shared _spf.matemail.pro policy no longer resolves to one strict SPF policy authorising the live SMTP IPv4. Check authoritative DNS and multiple resolvers. Do not edit tenant DNS or mail routing blindly."

  # ── Databases and Redis ─────────────────────────────────────────────────
  - name: datastores
    rules:
      - alert: PostgresDown
        expr: matemail_postgres_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "PostgreSQL ({{ $labels.instance }}) is not answering"

      - alert: RedisDown
        expr: matemail_redis_up == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Redis ({{ $labels.instance }}) is not answering"

      - alert: NativeRateLimitEnforcementUnavailable
        # NE4 made the limiter fail CLOSED: without its counters, mailboxes
        # with a configured limit defer instead of sending unmetered. That
        # makes Native Redis a mail-flow dependency, not a cache.
        expr: matemail_rate_limit_enforcement_available == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Per-mailbox rate limiting cannot be enforced"
          description: "Native Redis or the policy service is unavailable. Mailboxes with a configured limit will have their mail deferred, by design."

      - alert: PostgresLongRunningQueries
        expr: matemail_postgres_long_running_queries > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} queries running over a minute on {{ $labels.instance }}"

      - alert: PostgresLocksWaiting
        expr: matemail_postgres_locks_waiting > 5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} ungranted lock requests on {{ $labels.instance }}"

      - alert: RedisEvictingKeys
        expr: increase(matemail_redis_evicted_keys_total[1h]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Redis ({{ $labels.instance }}) is evicting keys"
          description: "Evictions mean it is over its memory limit and silently dropping data."

  # ── Host ────────────────────────────────────────────────────────────────
  # Thresholds: disk 15%/8% free, inodes 15%/8% free, memory 8% available,
  # swap 60% used, load 2x/4x cores.
  - name: host
    rules:
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Disk is {{ $value | printf \"%.1f\" }}% free"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 8
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Disk is {{ $value | printf \"%.1f\" }}% free"
          description: "A full disk stops mail, stops the databases and stops backups, in that order."

      - alert: InodesLow
        expr: (node_filesystem_files_free{mountpoint="/"} / node_filesystem_files{mountpoint="/"}) * 100 < 15
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | printf \"%.1f\" }}% of inodes remain"
          description: "Maildir stores one file per message, so inodes can run out long before bytes do."

      - alert: InodesCritical
        expr: (node_filesystem_files_free{mountpoint="/"} / node_filesystem_files{mountpoint="/"}) * 100 < 8
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Only {{ $value | printf \"%.1f\" }}% of inodes remain"

      - alert: MemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 8
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Only {{ $value | printf \"%.1f\" }}% of memory is available"

      - alert: SwapPressure
        expr: ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes) * 100 > 60
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Swap is {{ $value | printf \"%.1f\" }}% used"

      - alert: LoadHigh
        expr: node_load15 > 2 * count(count(node_cpu_seconds_total) by (cpu))
        for: 20m
        labels: {severity: warning}
        annotations:
          summary: "15-minute load average is {{ $value | printf \"%.1f\" }}"

      - alert: LoadCritical
        expr: node_load15 > 4 * count(count(node_cpu_seconds_total) by (cpu))
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "15-minute load average is {{ $value | printf \"%.1f\" }}"

      - alert: MailStorageGrowingFast
        # Aggregate free space on / hides this completely: a mailbox volume can
        # double in a day and still be invisible inside 150 GB of headroom.
        expr: delta(matemail_volume_bytes{volume="vmail"}[6h]) > 5e9
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Mail storage grew {{ $value | humanize1024 }}B in six hours"

  # ── Backups ─────────────────────────────────────────────────────────────
  - name: backups
    rules:
      - alert: BackupStale
        # The timer is daily. 36 hours allows one missed run plus the
        # randomised delay before anyone is told.
        expr: time() - matemail_backup_latest_snapshot_timestamp_seconds > 129600
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Newest backup snapshot is over 36 hours old"
          description: "Check: systemctl status matemail-backup.service and journalctl -u matemail-backup.service"

      - alert: BackupFailed
        expr: matemail_backup_last_result_ok == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "The last backup run failed"
          description: "A failed run leaves no snapshot, so the repository is unchanged and the previous backup is now the newest."

      - alert: BackupTimerDisabled
        expr: matemail_backup_timer_enabled == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "The backup timer is not enabled; no backups are being taken"

      - alert: BackupOffsiteNotConfigured
        # The dedicated Restic repository remains local. A recent successful
        # MateServer Azure DR archive ALSO provides off-host coverage, as
        # long as the collector verifies the current MateMail coverage contract.
        # Fail closed when the signal is absent, never hide a missing collector.
        expr: (matemail_backup_offsite_coverage_ok == 0) or absent(matemail_backup_offsite_coverage_ok)
        for: 1h
        labels: {severity: warning, persistent: "true"}
        annotations:
          summary: "MateMail has no verified recent offsite recovery coverage"
          description: "Neither a recent verified MateServer Azure DR upload nor an independent offsite Restic snapshot protects mail. Check mateserver-backup.service, the latest Azure DR completion log and the central_dr collector section."

      - alert: CentralDRBackupFailed
        expr: matemail_central_dr_last_result_ok == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "The latest MateServer Azure DR backup job failed"
          description: "Check systemctl status mateserver-backup.service and its root-owned logs. Do not disable the timer or overwrite archives."

      - alert: CentralDRBackupStale
        expr: (time() - matemail_central_dr_last_success_timestamp_seconds > 129600) or (matemail_central_dr_last_success_timestamp_seconds == 0)
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "No successful Azure DR archive upload in the last 36 hours"
          description: "The Azure DR completion marker is missing or stale. Inspect the host-wide backup job, its latest log and Azure upload errors."

      - alert: CentralDRBackupTimerDisabled
        expr: matemail_central_dr_timer_enabled == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "MateServer Azure DR backup timer is disabled"

      - alert: CentralDRMateMailCoverageDrift
        expr: matemail_central_dr_matemail_script_coverage_ok == 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Central DR script no longer declares the required MateMail recovery inputs"
          description: "Inspect database dumps, mail and DKIM volumes, and Azure latest/daily archive uploads in /opt/mateserver-backup/bin/backup.sh."

  # ── TLS ─────────────────────────────────────────────────────────────────
  - name: tls
    rules:
      - alert: CertificateExpiringSoon
        expr: matemail_certificate_days_remaining < 21
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "Certificate for {{ $labels.host }} expires in {{ $value }} days"

      - alert: CertificateExpiringCritical
        # Let's Encrypt renews at 30 days. Reaching 7 means renewal is broken.
        expr: matemail_certificate_days_remaining < 7
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Certificate for {{ $labels.host }} expires in {{ $value }} days"
          description: "Automatic renewal should have happened at 30 days. It has not."

      - alert: CertbotTimerDisabled
        expr: matemail_certbot_timer_enabled == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "The certbot renewal timer is not enabled"

  # ── Exposure. Security conditions fire fast. ────────────────────────────
  - name: exposure
    rules:
      - alert: ForbiddenMailPortPublic
        # NE7 made 25, 587 and 993 public BY DESIGN, so the old
        # "any public mail port" alert would now fire on the architecture. What
        # is still an incident is a port nobody decided to open: POP3 and its
        # TLS variant are not offered at all, plaintext IMAP would carry a
        # password in clear, and 465 is a deliberate omission (DEC-042).
        #
        # Still no real `for:` window. A password-carrying port becoming public
        # is not something to sit on.
        expr: matemail_forbidden_mail_ports_public > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "A mail port that must never be public is publicly reachable"
          description: "{{ $value }} of 110/143/465/995 are bound to a non-loopback address. See matemail_mail_port_public for which. Detection only: nothing here changes a firewall rule."

      - alert: PublicMailPortMissing
        # The other half of the same policy, which could not exist before NE7.
        # A submission or IMAPS port that has stopped listening is a customer
        # outage, and previously nothing would have said so.
        expr: matemail_intended_mail_ports_missing > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "A public mail port has stopped listening"
          description: "{{ $value }} of 25/587/993 are not listening. Inbound mail, client submission or mailbox access is down."

      - alert: NativeUnintendedPortPublished
        expr: matemail_native_unintended_published_ports > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "A Native container port beyond 25/587/993 is published publicly"

      - alert: UnexpectedPublicPort
        # Not every non-loopback listener is Internet-accessible. Host processes
        # blocked by active UFW default-deny stay visible in the separate
        # unexpected_bound_ports metric; explicit UFW allows, permissive/failed
        # firewall state and Docker-published ports continue to alert.
        expr: matemail_unexpected_public_ports > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} unexpected TCP listener(s) may be exposed"
          description: "Unexpected TCP listeners with a permissive/missing UFW gate or Docker-public binding. The raw bound-port count is reported separately. Investigate exposure; do not restart unrelated services."

      - alert: FirewallInactive
        expr: matemail_ufw_active == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The host firewall is not active"

      - alert: AbuseProtectionDown
        # Public submission and IMAPS attract credential stuffing continuously.
        # A stopped jail looks exactly like a quiet week.
        expr: matemail_fail2ban_up == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Abuse protection (fail2ban) is not running"
          description: "Public submission and IMAPS are open with no brute-force protection."

      - alert: AbuseProtectionBlind
        # The subtler failure: fail2ban is running, healthy, and reading a file
        # nobody is writing to. It bans nothing and reports nothing wrong.
        expr: matemail_fail2ban_log_shipper_up == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Mail logs are not reaching fail2ban"
          description: "fail2ban may be running against a stale file, in which case it will never ban anything while appearing healthy."

      - alert: AbuseProtectionJailMissing
        expr: matemail_fail2ban_jail_up == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Jail {{ $labels.jail }} is not loaded"

      - alert: CredentialStuffingBurst
        # Not a security incident on its own - this is the Internet. It is
        # worth knowing about when it is unusual, and the bans are the signal
        # that protection is working rather than that something is broken.
        expr: increase(matemail_fail2ban_banned_total[1h]) > 20
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} bans in the last hour on {{ $labels.jail }}"
          description: "A sustained authentication attack. Protection is working; this is informational unless legitimate users are affected."


  # ── NE6 readiness ───────────────────────────────────────────────────────
  - name: readiness
    rules:
      - alert: NE6ReadinessRegressed
        # Informational rather than urgent: this is a gate, not an outage.
        # It excludes offsite backup and the alert receiver on purpose; both
        # are real pre-beta gaps and both are reported separately so that
        # neither can be quietly marked green.
        expr: matemail_ne6_ready == 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "NE6 technical readiness is not satisfied"
          description: "{{ $value }} — see matemail_ne6_readiness_check for which prerequisite is failing."
