# SMTP authentication abuse against the Native submission listener.
#
# Matches only what is unambiguously an attack: a failed SASL authentication,
# and a relay attempt refused by the anti-relay rules. Both carry the client
# address, and neither can be produced by a correctly configured client.
#
# It deliberately does NOT match `reject_sender_login_mismatch` or an unknown
# recipient. Those are ordinary misconfiguration and, for port 25, ordinary
# Internet noise; banning on them would ban real senders.

[Definition]

failregex = ^.*postfix/(?:submission/)?smtpd\[\d+\]: warning: [\w.\-]*\[<HOST>\]: SASL (?:LOGIN|PLAIN|CRAM-MD5|DIGEST-MD5) authentication failed
            ^.*postfix/(?:submission/)?smtpd\[\d+\]: NOQUEUE: reject: RCPT from [\w.\-]*\[<HOST>\]: 554 5\.7\.1 .*Relay access denied

ignoreregex =

datepattern = ^%%b %%d %%H:%%M:%%S
