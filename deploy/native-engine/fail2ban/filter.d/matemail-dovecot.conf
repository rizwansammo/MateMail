# IMAP authentication abuse against the Native IMAPS listener.
#
# Dovecot 2.4 reports a failed login on the disconnect line, with the remote
# address in `rip=`. Matching the disconnect rather than the auth line is what
# gives us the address: the auth-worker line does not always carry it.

[Definition]

failregex = ^.*(?:imap|managesieve)-login: (?:Info: )?(?:Aborted login|Disconnected)[^\n]*\bauth failed\b[^\n]*\brip=<HOST>
            ^.*(?:imap|managesieve)-login: (?:Info: )?(?:Aborted login|Disconnected)[^\n]*\bauth_failed\b[^\n]*\brip=<HOST>

ignoreregex =

datepattern = ^%%b %%d %%H:%%M:%%S
