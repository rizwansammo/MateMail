# IMAP authentication abuse against the Native IMAPS listener.
#
# THE WORDING IS VERSION SPECIFIC, AND GETTING IT WRONG IS SILENT
#   Dovecot 2.3 reported a failed login as "Aborted login" or "Disconnected".
#   Dovecot 2.4 — which is what runs here — says:
#
#     imap-login: Info: Login aborted: Connection closed
#       (auth failed, 1 attempts in 2 secs) (auth_failed):
#       user=<...>, method=PLAIN, rip=1.2.3.4, ...
#
#   The first version of this filter carried the 2.3 wording, was checked
#   against a hand-written sample of that wording, and matched ZERO of the real
#   lines this server produces. fail2ban would have started cleanly, reported
#   itself healthy, shown no bans, and never stopped an IMAP brute-force.
#
#   That is why the tests for this file now use log lines captured from the
#   running system rather than lines written from memory of the format.
#
#   Both wordings are matched: 2.3's in case an older Dovecot is ever run
#   beside this, 2.4's because it is what is deployed.
#
# The address comes from `rip=`. Matching the login-aborted line rather than
# the auth-worker line is what makes that address available at all.

[Definition]

failregex = ^.*(?:imap|pop3|managesieve)-login: (?:Info: )?Login aborted:[^\n]*\bauth[ _]failed\b[^\n]*\brip=<HOST>
            ^.*(?:imap|pop3|managesieve)-login: (?:Info: )?(?:Aborted login|Disconnected)[^\n]*\bauth[ _]failed\b[^\n]*\brip=<HOST>

# A clean logout also contains the words "Disconnected" and "Logged out", and
# a successful login contains "Logged in". None of them contain an auth
# failure, which is what the patterns above require.
ignoreregex =

datepattern = ^%%b %%d %%H:%%M:%%S
