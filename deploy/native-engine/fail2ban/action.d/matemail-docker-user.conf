# Ban an address for traffic to Docker-published mail ports.
#
# WHY NOT THE STANDARD ACTION
#   fail2ban's iptables actions insert into INPUT. Traffic to a Docker
#   published port never reaches INPUT: Docker DNATs it in nat/PREROUTING and
#   it is then evaluated in FORWARD, through DOCKER-FORWARD, which accepts it
#   long before any INPUT rule could apply. That is the same reason port 4000
#   on this host is publicly reachable with no UFW rule permitting it.
#
#   So a default fail2ban install here would run, log bans, show them in
#   `fail2ban-client status`, and block nothing at all. DOCKER-USER is the one
#   chain Docker guarantees to traverse BEFORE its own accept rules, and it is
#   the only place a ban can actually take effect.
#
# SCOPE
#   The ban drops every forwarded packet from that source address, to any
#   container. For an address brute-forcing SMTP AUTH that is intended. It
#   matches on source only, so nothing else is affected.

[Definition]

# Own chain, jumped to from the top of DOCKER-USER, so unbanning never has to
# find a rule among Docker's.
actionstart = <iptables> -N f2b-<name> 2>/dev/null || true
              <iptables> -A f2b-<name> -j RETURN 2>/dev/null || true
              <iptables> -I DOCKER-USER -j f2b-<name>

actionstop = <iptables> -D DOCKER-USER -j f2b-<name> 2>/dev/null || true
             <iptables> -F f2b-<name> 2>/dev/null || true
             <iptables> -X f2b-<name> 2>/dev/null || true

# Docker rewrites DOCKER-USER on daemon restart. If the jump has gone, this
# reports unhealthy and fail2ban re-runs actionstart rather than banning into
# a chain nothing reaches.
actioncheck = <iptables> -n -L DOCKER-USER | grep -q 'f2b-<name>[ \t]'

actionban = <iptables> -I f2b-<name> 1 -s <ip> -j DROP

actionunban = <iptables> -D f2b-<name> -s <ip> -j DROP

[Init]
iptables = iptables -w
name = default
