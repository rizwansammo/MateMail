# MateMail Native Engine — NE4 action thresholds.
#
# QUARANTINE IS THE `add header` BAND, not `soft reject`.
#
# That distinction was found by testing rather than reasoning. `soft reject`
# makes the milter return 451 to the CLIENT: the message is never accepted, so
# it never enters a queue and there is nothing to quarantine or release. A
# message scoring 11.40 was tempfailed at submission and simply vanished from
# the engine's point of view.
#
# `add header` accepts the message and lets Rspamd annotate it, which is what
# the quarantine design needs: milter_headers adds the marker, Postfix's
# header_checks moves it to the hold queue, and it sits there until released.
#
# `soft reject` is therefore deliberately NOT configured here — greylisting is
# not part of NE4, and leaving it unset keeps the band between add_header and
# reject unambiguous.
reject = 15;
add_header = 6;
greylist = 4;
