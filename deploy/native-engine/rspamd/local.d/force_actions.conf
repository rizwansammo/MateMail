# MateMail Native Engine — NE4 scanner-failure policy.
#
# A SCANNER THAT COULD NOT ANSWER IS NOT A CLEAN VERDICT.
#
# Rspamd scores CLAM_VIRUS_FAIL at zero by default, so when ClamAV is
# unreachable a message simply flows through unscanned and looks identical to
# one that was checked and found clean. Measured during NE4: with ClamAV absent,
# mail was accepted and delivered with no antivirus verdict at all.
#
# Deferring is the honest answer. The sender retries, the message is not lost,
# and nothing is delivered on the strength of a scan that never happened. This
# is a temporary condition by definition — either the scanner comes back, or an
# operator notices mail queuing, which is exactly the signal a silent bypass
# denies them.
#
# `soft reject` is used rather than a score, because a score high enough to
# defer would also have to sit below `reject`, and any threshold in that band is
# also the quarantine band. An explicit action keeps the two decisions separate.
rules {
  antivirus_unavailable {
    action = "soft reject";
    expression = "CLAM_VIRUS_FAIL";
    message = "Antivirus temporarily unavailable; please retry";
  }
}
