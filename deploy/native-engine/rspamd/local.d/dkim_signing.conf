# MateMail Native Engine — DKIM signing.
#
# WHAT: where Rspamd finds per-domain signing keys.
# WHY:  DEC-007r — the private key is generated and kept INSIDE the engine and
#       never crosses MailEngineAdapter. matemail-native-api owns the lifecycle
#       and shares this volume; MateMail only ever receives public material.
# PHASE: NE1 defines the path. NE2 implements generation, rotation and deletion.
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector = "mm1";
allow_username_mismatch = true;
use_domain = "header";
