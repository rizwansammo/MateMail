# MateMail Native Engine — outbound DKIM signing.
#
# THE SELECTOR IS NOT HARDCODED.
#   An earlier draft carried `selector = "mm1"`, which is the default for a new
#   domain and wrong for every domain that has since rotated onto a different
#   one. The failure is quiet and bad: Rspamd would look for
#   `<domain>.mm1.key`, and either find nothing and send unsigned, or sign with
#   a key whose name does not match the published DNS record. A signature that
#   fails to verify is worse than no signature — it reads as a forgery.
#
#   `selector_map` resolves the selector per domain from a file the engine API
#   publishes from the `dkim_key` rows, so the signing selector and the DNS
#   record it must match come from the same source.
#
#   There is deliberately NO global `selector` fallback. A domain missing from
#   the map is a provisioning bug, and the correct outcome is unsigned mail that
#   shows up in monitoring — not mail signed with a guessed selector that
#   receivers reject.
#
# THE KEY STORE IS READ-ONLY HERE.
#   `native_dkim` is mounted :ro. The engine API is the only writer (NE0.2,
#   DEC-007r), and it is the only component that ever holds a private key.
#   Rspamd reads; Postfix cannot see the directory at all.
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/var/lib/rspamd/dkim/selectors.map";

# Sign based on the From: header domain. The envelope sender has already been
# checked by Postfix — `reject_sender_login_mismatch` against
# `postfix_sender_login` — so by the time a message reaches the milter its
# sender is one the authenticated login is entitled to use.
use_domain = "header";

# Rspamd's own username/domain check is not used because Postfix already made
# the stronger one: it compared the SASL login against the set of addresses that
# login may send as, including internal aliases. Repeating a weaker version here
# would only reject mail the engine deliberately allows.
allow_username_mismatch = true;

# Only sign mail from authenticated submission. Inbound mail from the Internet
# must never leave here carrying our signature.
sign_authenticated = true;
sign_local = false;
