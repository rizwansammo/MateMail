# MateMail Native Engine — ClamAV integration.
#
# WHAT: hands each message to the native ClamAV daemon.
# WHY:  NE0.17 retains malware scanning. A scanner that is unreachable or slow
#       must DEFER the message, never let it through unscanned.
# PHASE: NE1 defines it; NE3 activates the milter path that feeds it.
clamav {
    type = "clamav";
    symbol = "CLAM_VIRUS";
    # NE4: without this the module emits NOTHING when ClamAV is unreachable —
    # it logs an error and the message scores as if it had been scanned and
    # found clean. Naming the failure symbol is what lets force_actions.conf
    # defer instead of delivering on a verdict that was never obtained.
    symbol_fail = "CLAM_VIRUS_FAIL";
    servers = "clamav:3310";
    scan_mime_parts = false;
    log_clean = true;
    max_size = 20971520;
}
