# MateMail Native Engine — symbol scores that actually decide an outcome.
#
# WHY THIS FILE EXISTS
#   Rspamd's antivirus module ships CLAM_VIRUS with a score of ZERO. It detects
#   and then does nothing. Measured, not assumed: an EICAR probe through the
#   full NE3 path produced
#
#       CLAM_VIRUS(0.00){Eicar-Test-Signature;}  ...  [11.40/15.00] add header
#
#   and the message was DELIVERED to the recipient's Maildir. An antivirus that
#   scans, correctly identifies malware, and then hands it to the customer is
#   worse than none, because it looks like protection on a dashboard.
#
# WHICH PHASE OWNS IT
#   NE3. It belongs with the mail flow, not with the scanner's deployment.

group "antivirus" {
    symbols {
        # Far above the reject threshold (15) so this single symbol decides the
        # message on its own, rather than needing other symbols to push it over.
        # A confirmed virus is not a score to be weighed against other evidence.
        "CLAM_VIRUS" {
            score = 2000.0;
            description = "ClamAV identified malware";
        }
        # The scanner being BROKEN is a different state from the mail being
        # clean, and must not be silently treated as clean. A small positive
        # score leaves it visible in the headers without rejecting mail because
        # our own scanner is unwell; `milter_default_action = tempfail` in
        # Postfix already defers when Rspamd itself is unreachable.
        "CLAM_VIRUS_FAIL" {
            score = 0.0;
            description = "ClamAV could not scan this message";
        }
    }
}

group "external_services" {
    symbols {
        # Macro findings from oletools are SUSPICION, not proof: legitimate
        # business documents carry macros. These push a message toward the spam
        # threshold and let the rest of the scoring decide, rather than
        # rejecting a customer's invoice template outright.
        "OLETOOLS_AUTOEXEC" {
            score = 6.0;
            description = "Document runs a macro automatically on open";
        }
        "OLETOOLS_SUSPICIOUS" {
            score = 6.0;
            description = "Document macro uses a suspicious construct";
        }
        "OLETOOLS_MACRO" {
            score = 1.0;
            description = "Document contains a macro";
        }
        "OLETOOLS_FAIL" {
            score = 0.0;
            description = "oletools could not analyse this document";
        }
    }
}
