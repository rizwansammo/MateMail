# MateMail Native Engine — NE4 quarantine marking.
#
# Rspamd cannot move a message to Postfix's hold queue directly, so it marks it
# and Postfix's header_checks does the move. This file defines the mark.
#
# THE REMOVAL IS THE SECURITY PROPERTY, not the addition.
#   `remove = 1` strips every inbound copy of the header before Rspamd adds its
#   own. Without it a remote sender could set X-MateMail-Quarantine themselves.
#   That would only let them quarantine their own message — the header cannot
#   release anything or skip scanning — but a header whose meaning is partly
#   attacker-controlled is not a header worth trusting, and removing it costs
#   one line.
#
# `authenticated_headers` is deliberately NOT used here: this mark must be
# applied to inbound Internet mail too, which is most of what gets quarantined.
use = ["x-matemail-quarantine"];

custom {
  x-matemail-quarantine = <<EOD
return function(task, common_meta)
  -- Remove any copy the client supplied, always, whatever we decide below.
  local remove = {['X-MateMail-Quarantine'] = 0}

  -- `add header` is the band NE4 treats as quarantine: Rspamd considers the
  -- message suspicious but not rejectable, and the engine holds it for review
  -- rather than putting it in someone's inbox.
  --
  -- NOT `soft reject`: that tempfails the client, so the message is never
  -- accepted and there is nothing to hold. Measured, not assumed.
  local action = task:get_metric_action('default')
  if action == 'add header' then
    return nil, {['X-MateMail-Quarantine'] = 'yes'}, remove, common_meta
  end
  return nil, {}, remove, common_meta
end
EOD;
}
