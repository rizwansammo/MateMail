# MateMail Native Engine — Olefy (OLE/macro) integration.
#
# WHAT: sends Office attachment parts to the native Olefy service.
# WHY:  macro-bearing documents are the dominant malware vector in business
#       email, which is why NE0.17 retains this scanner.
# PHASE: NE1 defines it; NE3 activates it.
oletools {
    type = "oletools";
    servers = "olefy:10055";
    scan_mime_parts = true;
    extended = true;
    max_size = 3145728;
    timeout = 20.0;
}
