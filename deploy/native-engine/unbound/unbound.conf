# MateMail Native Engine — validating recursive resolver.
#
# WHAT THIS CONFIGURES
#   Unbound, the only DNS resolver the native mail daemons are allowed to use.
#
# WHY IT IS SHAPED THIS WAY
#   Postfix runs DANE (smtp_tls_security_level = dane), and DANE's security
#   comes entirely from DNSSEC validation. Point Postfix at the host resolver or
#   a public one that does not validate and outbound mail keeps flowing while
#   the TLSA guarantee quietly disappears — a silent downgrade, which is the
#   failure class this architecture exists to avoid. See NE0.18.
#
# WHICH PHASE OWNS IT
#   NE1 (foundation). NE3 wires Postfix's DANE behaviour on top of it.

server:
    verbosity: 0
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Only the engine network may query this resolver. It is not a public
    # resolver and must never become one.
    access-control: 127.0.0.0/8 allow
    access-control: 172.27.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    # ── DNSSEC ───────────────────────────────────────────────────────────────
    # The trust anchor lives on a persistent volume so a restart does not
    # re-bootstrap it. A bogus answer must be SERVFAIL — never a downgrade to
    # an unvalidated answer.
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-permissive-mode: no
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-below-nxdomain: yes
    qname-minimisation: yes

    # Modest cache; this serves one mail stack, not a network.
    cache-max-ttl: 86400
    cache-min-ttl: 0
    msg-cache-size: 32m
    rrset-cache-size: 64m
    num-threads: 2
    so-reuseport: yes

    # Mail needs to resolve names that resolve to private space as rarely as
    # possible, but rebinding protection must not break a legitimate lookup of
    # our own infrastructure. Left at the default (private-address unset) and
    # revisited at NE3 when the real hostnames are known.

    hide-identity: yes
    hide-version: yes
    prefetch: yes
