# MateMail Native Engine — Dovecot (NE1 foundation).
#
# WHAT THIS CONFIGURES
#   Enough Dovecot 2.4 to start, stay healthy and hold the mail store layout the
#   native engine will use. Authentication is DENIED FOR EVERYONE.
#
# WHY IT IS SHAPED THIS WAY
#   The storage layout deliberately MATCHES mailcow's — Maildir under
#   /var/vmail/<domain>/<local_part>, vmail 5000:5000 — for two reasons given in
#   NE0.4: the platform sender's maildir can be copied verbatim at NE6, and the
#   configuration stays conventional rather than bespoke.
#
#   Quota is maildir-based rather than a SQL dict, so enforcement keeps working
#   even when the engine database does not. A mailbox that cannot be told it is
#   full is a disk that fills.
#
#   AUTHENTICATION FAILS CLOSED. An earlier draft used a `static` passdb with
#   `nopassword=y`, which would have accepted ANY credential for ANY user — a
#   passwordless placeholder is not a placeholder, it is an open door waiting
#   for someone to expose the port. This now points at an EMPTY passwd-file:
#   no user matches, so every authentication attempt fails, and there is no
#   fake account to forget about later.
#
#   NE3 replaces the passdb/userdb with a READ-ONLY SQL lookup against the
#   engine database using BLF-CRYPT — read-only because `matemail-native-api`
#   is the only direct writer (NE0.2, NE0.21).
#
#   Syntax is Dovecot 2.4, validated against the image this actually runs on.
#   2.4 reorganised the config format: `dovecot_config_version` must come first,
#   passdb/userdb are named blocks, and `mail_location` split into
#   `mail_driver`/`mail_path`.
#
# WHICH PHASE OWNS IT
#   NE1 (skeleton and identity model). NE3 owns real auth, LMTP and namespaces.

dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0

base_dir = /run/dovecot
state_dir = /run/dovecot

# IMAP only at NE1. LMTP and submission arrive with the mail path in NE3.
protocols = imap

# No listener is published by Compose, so nothing is reachable from the host;
# binding loopback keeps that true even if a future port mapping is added by
# mistake.
listen = 127.0.0.1

# ── Process identities ───────────────────────────────────────────────────────
#
# Dovecot's normal privilege model, which is the reason the engine runs a
# MateMail-built Dovecot image rather than the upstream one directly:
#
#   master      starts as root, creates its sockets and runtime directories,
#               then drops privileges — it does not stay root
#   dovenull    pre-auth and login processes: the most exposed code, given an
#               identity that owns NO mail and no engine data
#   dovecot     internal services (auth, dict, stats), separate from both the
#               login identity and the mail identity
#   vmail 5000  mail access only
#
# The upstream image ships none of this: it has one account, `vmail` at
# 1000:1000, no `dovecot` and no `dovenull`, and runs unprivileged as vmail.
# That forced all three identities onto a single user and made uid 5000
# unreachable. `images/dovecot/Dockerfile` restores the separation while keeping
# the upstream Dovecot binaries byte-for-byte identical.
default_internal_user = dovecot
default_internal_group = dovecot
default_login_user = dovenull

# ── Mail store ───────────────────────────────────────────────────────────────
# Matches the engine this will replace, so NE6 can copy the platform sender's
# maildir without translating a layout, and so storage ownership is unambiguous.
#
# 5000:5000 is an NE1 foundation property, established by the image itself — not
# a value this file hopes the runtime happens to support.
mail_driver = maildir
mail_path = ~/
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_index_path = /var/vmail_index/%{user | domain}/%{user | username}
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  separator = /
  inbox = yes
}

# Enforcement that survives an engine-database outage — see NE0.4.
mail_plugins {
  quota = yes
}

quota storage {
  quota_storage_size = 1G
}

# ── Authentication — DENY ALL (NE1) ──────────────────────────────────────────
#
# `users` is an empty passwd-file. Nobody matches it, so every authentication
# attempt fails. That is the intended NE1 behaviour: the foundation must not be
# able to authenticate anyone, and it must not contain a fake account that
# outlives the phase.
#
# There is deliberately no `nopassword`, no `static` accept-all, and no default
# user anywhere in this file.
#
# The denial was proven by MUTATION against this image, not by reading the file:
# with one BLF-CRYPT account temporarily added, the correct password
# authenticated and a wrong password and an unknown user did not. So the passdb
# really is consulted, and the empty file really is what refuses everyone —
# rather than a misconfigured lookup that happens to fail.
auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

# TLS is NE3's, together with the certificate distribution model (NE0.9).
ssl = no

log_path = /dev/stderr
info_log_path = /dev/stderr
