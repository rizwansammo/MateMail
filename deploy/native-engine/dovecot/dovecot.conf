# MateMail Native Engine — Dovecot (NE3 mail flow).
#
# WHAT THIS CONFIGURES
#   Authentication, user lookup and LMTP delivery against the engine database,
#   read-only. NE1 established the identity and storage model and denied every
#   authentication; NE3 replaces the deny-all passdb with a real SQL lookup and
#   adds the LMTP listener Postfix delivers through.
#
# WHY IT IS SHAPED THIS WAY
#   READ-ONLY, ALWAYS. `matemail-native-api` is the only component permitted to
#   write the engine database (NE0.2). Dovecot connects as `engine_ro_dovecot`,
#   which has SELECT on exactly two views and cannot reach a base table at all.
#   That is enforced by PostgreSQL grants, not by this file being careful.
#
#   TWO VIEWS, NOT THE TABLES. `dovecot_auth` and `dovecot_userdb` are the whole
#   contract (migration 003). Dovecot cannot see the routing views, cannot see
#   dkim_key, and cannot see a column the views do not publish. The schema can
#   be reorganised underneath without touching this file.
#
#   2.4 FIELD NAMES. userdb fields are settings in 2.4: `home`, `uid` and `gid`
#   no longer exist. The view returns `mail_home` and `quota_storage_size` under
#   exactly those names. uid/gid are deliberately NOT served from the database —
#   they are the same 5000:5000 for every mailbox, so they are pinned below
#   where a database compromise cannot choose the uid that writes to disk.
#
# WHICH PHASE OWNS IT
#   NE1 owns the identity and storage model below. NE3 owns auth, userdb, LMTP.

dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0

base_dir = /run/dovecot
state_dir = /run/dovecot

# LMTP joins IMAP at NE3: it is how Postfix hands mail to the mail store.
protocols = imap lmtp sieve

# NE1 bound loopback because nothing was allowed to reach Dovecot at all. NE3
# must accept LMTP from the Postfix container, which arrives on the compose
# network, so loopback-only is no longer possible.
#
# What keeps this closed is NOT the bind address: Compose publishes no ports for
# this service, so the listener exists only on the internal `native` network and
# is unreachable from the host or the Internet. Public exposure is NE5's, behind
# TLS and a submission/IMAPS policy — not something this line should decide.
listen = *

# ── Process identities ───────────────────────────────────────────────────────
#
# Dovecot's normal privilege model, which is the reason the engine runs a
# MateMail-built Dovecot image rather than the upstream one directly:
#
#   master      starts as root, creates its sockets and runtime directories,
#               then drops privileges — it does not stay root
#   dovenull    pre-auth and login processes: the most exposed code, given an
#               identity that owns NO mail and no engine data
#   dovecot     internal services (auth, dict, stats), separate from both the
#               login identity and the mail identity
#   vmail 5000  mail access only
default_internal_user = dovecot
default_internal_group = dovecot
default_login_user = dovenull

# ── Mail store ───────────────────────────────────────────────────────────────
# Matches mailcow's layout so NE6 can copy the platform sender's maildir without
# translating it: Maildir directly under /var/vmail/<domain>/<local part>, not a
# Maildir/ subdirectory.
#
# mail_home is ALSO returned by the userdb view, which takes precedence. It is
# kept here as the fallback for lookups that predate a userdb answer, and so the
# two definitions are visibly the same shape rather than silently divergent.
mail_driver = maildir
mail_path = ~/
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_index_path = /var/vmail_index/%{user | domain}/%{user | username}
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000

namespace inbox {
  separator = /
  inbox = yes
}

# Enforcement that survives an engine-database outage — see NE0.4.
mail_plugins {
  quota = yes
}

# QUOTA. The per-mailbox limit arrives from the userdb as `quota_storage_size`;
# this top-level value is the fallback for a mailbox the userdb did not size,
# and it is deliberately a real limit rather than `unlimited` — a mailbox that
# cannot be told it is full is a disk that fills.
#
# THE DEFAULT MUST NOT LIVE INSIDE THE `quota storage` BLOCK. Written there, it
# WINS OVER the userdb value and every mailbox silently gets the fallback:
# measured on a mailbox provisioned with a 1 MB quota, `doveadm quota get`
# reported a 1048576 KB limit and a 2 MB message was accepted. Moving the
# default to the top level and leaving the quota root empty gives the userdb
# precedence — the same mailbox then reported a 1024 KB limit and LMTP refused
# the next delivery with "Quota exceeded".
#
# The empty `quota storage { }` block is what DECLARES the quota root, so it
# stays even though it now carries no settings.
quota_storage_size = 1G

quota storage {
}

# ── Engine database connection ───────────────────────────────────────────────
#
# The password is NOT in this file and never enters Git. It is read from the
# process environment, which Compose fills from the root-only MateServer `.env`.
# `doveconf` prints the unexpanded `%{env:...}` rather than the secret, so a
# configuration dump is safe to paste into an issue.
# The connection is rendered at container start by
# images/dovecot/entrypoint.sh into a root-only file, because Dovecot cannot
# read a secret from the environment itself — `%{env:...}` parses and then
# reaches libpq as an empty string ("fe_sendauth: no password supplied").
# Measured against this image, not assumed.
#
# `!include` rather than `!include_try`: if the credential was not rendered,
# Dovecot must refuse to start rather than come up healthy and authenticate
# nobody.
!include engine-db.conf

# ── Last login ───────────────────────────────────────────────────────────────
#
# Dovecot's own `last_login` plugin writes to a dictionary, which for us would
# mean giving Dovecot write access to the engine database — the one thing the
# architecture does not allow (NE0.2). Instead the auth-policy hook REPORTS a
# successful login to the engine API, which owns every write.
#
# Rendered by images/dovecot/entrypoint.sh because it carries a credential, and
# `!include` (not `!include_try`) so a missing render is loud. The generated
# file is a comment when no policy secret is set, which disables the hook
# without disabling Dovecot.
!include engine-policy.conf

# The doveadm API key, rendered at container start (NE4).
!include engine-doveadm.conf

# ── PostBox new-mail events ──────────────────────────────────────────────────
#
# After LMTP saves and commits a delivery, push_notification's Lua driver runs
# dovecot/postbox-push.lua, which reports the mailbox, folder, UIDVALIDITY and
# UID — never the message — to the engine API. The API relays it to MateMail,
# which sends the remote push to that mailbox's PostBox devices.
#
# Rendered by images/dovecot/entrypoint.sh because it carries the dedicated
# push credential. The plugins are enabled inside `protocol lmtp` only, and the
# generated file is a comment when no push secret is set: then no plugin loads
# and delivery is exactly what it was. With it, a failure of the hook is one
# log line and at most a one-second delay — it cannot refuse, defer, bounce or
# duplicate mail (measured against 2.4.1; see docs/POSTBOX_REMOTE_PUSH.md).
#
# `!include_try`, NOT `!include`, unlike the includes above. This file is
# config and ships with `git pull`; the entrypoint that renders the include
# ships in the image. Measured: this file with a Dovecot image from before the
# hook stops at "Fatal: ... No matches" - IMAP and LMTP down over an optional
# push feature. With `_try` a missing include means no push, never no mail.
!include_try engine-push.conf

# ── PostBox mailbox access (P11) ────────────────────────────────────────────
#
# PostBox authenticates the person with the password they type. It then needs
# to keep reading their mailbox for the life of their session, and MateMail
# deliberately stores no mailbox password — so the alternative to a master
# identity is keeping the customer's password in Django, Redis or a cookie.
# That trade is not close: a master credential lives in one root-only file on
# one host, a retained user password lives everywhere the session does.
#
# `*` separates the mailbox from the master user, so PostBox logs in as
# `someone@example.com*postbox`. The separator must be a character that cannot
# appear in an address, which `*` is.
auth_master_user_separator = *

# The master passdb itself. Rendered by images/dovecot/entrypoint.sh because it
# carries a credential, with `!include` rather than `!include_try` so a missing
# render refuses to start instead of silently disabling PostBox — or, worse,
# leaving `auth_master_user_separator` set with no master passdb, which makes
# every address containing `*` fail in a way nobody would connect to this file.
!include engine-postbox-master.conf

# ── Authentication ───────────────────────────────────────────────────────────
#
# The stored value is a Dovecot scheme string — `{BLF-CRYPT}$2b$...` — so no
# `default_password_scheme` is set: the scheme travels with each hash, which is
# what makes a future migration to a stronger scheme a per-row change rather
# than a flag day.
#
# Dovecot never receives a plaintext stored password: `dovecot_auth` publishes
# `password_hash` only, and the mailbox table's CHECK constraint refuses to
# store anything without a scheme prefix in the first place.
#
# The query is parameterised by Dovecot's own escaping of %{user}; the SQL
# driver quotes it, so a login name cannot terminate the literal.
auth_mechanisms = plain login

passdb sql {
  sql_driver = pgsql
  query = SELECT address AS username, password_hash AS password \
          FROM dovecot_auth WHERE address = '%{user}'
}

# A row here is what makes a user exist. An inactive mailbox, an inactive
# domain, or an address that was never provisioned returns no row, and Dovecot
# reports an unknown user — for IMAP login and for LMTP delivery alike.
userdb sql {
  sql_driver = pgsql
  query = SELECT mail_home, quota_storage_size \
          FROM dovecot_userdb WHERE address = '%{user}'
}

# ── LMTP ─────────────────────────────────────────────────────────────────────
#
# How Postfix delivers into the mail store. Unknown recipients are rejected here
# rather than accepted and bounced later: the userdb lookup above is the same
# one IMAP uses, so "this mailbox exists" has a single definition.
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

# ── Personal Sieve filtering / ManageSieve (PostBox Rules) ────────────────────
#
# Pigeonhole is already bundled in the pinned official Dovecot 2.4.1 image.
# LMTP executes ONLY this user's active script after the message arrives.
# The Maildir root is the mailbox user's home (mail_path = ~/). Placing
# scripts in ~/sieve or ~/.dovecot.sieve makes Dovecot mistakenly discover
# them as mail folders and causes LMTP quota/storage errors. Scripts therefore
# live OUTSIDE EVERY user's Maildir, under a separate tree in the existing
# persistent, backed-up native_vmail volume. The user/domain expansion is
# stable across IMAP, LMTP and ManageSieve and keeps scripts mailbox-private.
# Existing scripts must be migrated BEFORE activating this configuration.
# No new Docker volume, no index-volume-only state, no published 4190.
sieve_script personal {
  driver = file
  path = /var/vmail/.sieve/%{user | domain}/%{user | username}/scripts
  active_path = /var/vmail/.sieve/%{user | domain}/%{user | username}/active.sieve
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

# Only STARTTLS may authenticate: the existing mx.matemail.online certificate
# is presented by Dovecot end-to-end through the TCP gateway. Global
# auth_allow_cleartext=no and ssl=required protect ManageSieve as well.
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

# ── Administrative API (NE4) ─────────────────────────────────────────────────
#
# How the engine answers "how much mail is actually in this mailbox?". The only
# component that knows is Dovecot, and the Native API must not shell into its
# container to ask.
#
# SSL IS OFF because this listener exists only on the internal engine network,
# which publishes no ports, and NE3/NE4 have no certificate distribution — that
# is NE5's (NE0.9). Turning it on with the snakeoil certificate would be
# security theatre: the client would have to skip verification anyway.
#
# The API key is rendered by images/dovecot/entrypoint.sh into a root-only
# include, for the same reason the database password is: Dovecot cannot read a
# secret from its environment, and this file is in Git.
service doveadm {
  inet_listener http {
    port = 8080
    ssl = no
  }
}

service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = dovecot
    group = dovecot
  }

  # How Postfix authenticates submission clients. A unix socket on a shared
  # volume rather than an inet listener, so a customer's password is never on
  # the container network — only on a socket both containers can see and
  # nothing else can.
  #
  # `smtpauth` is gid 2102 in both images, fixed deliberately rather than
  # borrowed from Debian's `postfix` group, whose number the packaging owns.
  # 0660 with that group is the whole access control: Postfix is in the group,
  # and no other identity in either container is.
  unix_listener /run/dovecot-auth/auth-client {
    mode = 0660
    user = dovecot
    group = smtpauth
  }
}

# ── Public IMAP over TLS (NE7) ───────────────────────────────────────────────
#
# Until NE7 this was `ssl = no`, which was correct: no port carrying a password
# was published, and enabling TLS with a self-signed certificate would have
# been theatre — every client would have had to skip verification anyway.
#
# NE6 installed the real Let's Encrypt certificate for mx.matemail.online into
# `native_tls`, which this service already mounts read-only. NE7 publishes 993,
# so the certificate is now both available and required.
#
# `required` rather than `yes`: a client may not authenticate over a plaintext
# connection under any circumstance. Combined with the imap listener below
# being switched off entirely, there is no unencrypted path to a password.
ssl = required
ssl_server_cert_file = /etc/ssl/mail/cert.pem
ssl_server_key_file = /etc/ssl/mail/key.pem

# TLS 1.2 is the floor. 1.0 and 1.1 are withdrawn, and no mail client that can
# reach a 2026 IMAP server is limited to them.
ssl_min_protocol = TLSv1.2
ssl_server_prefer_ciphers = server

service imap-login {
  # Plaintext IMAP is not merely unpublished, it does not listen at all.
  # Leaving 143 bound inside the container would mean one careless `ports:`
  # entry stands between a password and the Internet.
  inet_listener imap {
    port = 0
  }

  # The only mailbox access port NE7 opens. TLS from the first byte — not
  # STARTTLS — so there is no plaintext phase to strip.
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

log_path = /dev/stderr
info_log_path = /dev/stderr
