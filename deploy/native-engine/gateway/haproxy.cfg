# Native Engine — private submission gateway.
#
# WHY THIS EXISTS
#   MateMail has to reach Native Postfix on 587, and three constraints fight
#   each other:
#
#     1. Django verifies the server certificate and its hostname. It dials
#        `mx.matemail.online`, so whatever answers must present the real
#        certificate for that name. No `extra_hosts`, no IP in .env, no
#        disabled verification.
#     2. Postfix must stay on the engine network only. Putting MateMail on the
#        engine network would also put it next to PostgreSQL, Dovecot, Redis,
#        Rspamd and the DKIM key store — a compromised web application would
#        then be one connection away from the mail store.
#     3. No mail port may be published to the host before NE7.
#
#   This container is the whole answer. It carries the network alias
#   `mx.matemail.online` on the link network MateMail shares, and forwards to
#   Postfix on the engine network. It is the only thing MateMail can reach, and
#   the only port it can reach is 587.
#
# MODE TCP, NOT TLS TERMINATION
#   Pure byte forwarding. The STARTTLS session is negotiated end to end between
#   Django and Postfix, so the certificate Django validates is the one Postfix
#   actually holds and the AUTH credentials are never readable here. A
#   terminating proxy would have to hold the certificate AND would see the
#   plaintext password, which is a worse place for both.
#
#   It also means this container has no secrets at all. Read-only filesystem,
#   nothing to steal.
#
# NATIVE-OWNED PRIVATE GATEWAY\n#   This is the permanent application-to-engine TCP gateway. It carries no\n#   secrets and exposes only explicitly configured authenticated protocols.\n
global
    log stdout format raw local0 info
    maxconn 1024

defaults
    mode                tcp
    log                 global
    option              tcplog
    option              dontlognull
    # Long enough for a slow scanner to finish; short enough that a wedged
    # connection is not held open all day.
    timeout connect     10s
    timeout client      5m
    timeout server      5m

# Postfix is resolved by name through Docker's embedded DNS, re-resolved on a
# short hold. Pinning an IP would break the first time the engine is recreated,
# and would do it silently — the gateway would keep listening and every send
# would time out.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries     3
    timeout resolve     1s
    timeout retry       1s
    hold valid          10s
    hold nx             5s
    hold other          5s

# Liveness, on loopback only, answering without touching Postfix.
#
# The container's health check used to be `nc -z 127.0.0.1 587`. In `mode tcp`
# any connection to the frontend makes HAProxy immediately open one to the
# backend, so every health check dropped a half-open session on Postfix, which
# logged "lost connection after CONNECT" — twice a minute, forever, into the
# same metric that is supposed to reveal clients failing mid-session.
#
# `monitor-uri` answers from HAProxy itself. Bound to loopback so it is not
# reachable from the link network and cannot become an unauthenticated probe
# of the mail path.
frontend health
    bind 127.0.0.1:8405
    mode http
    monitor-uri /healthz

# The ONLY listener reachable by MateMail. There is deliberately no frontend
# for the API, for IMAP, or for port 25: MateMail talks to the Native API
# directly over the link network, and nothing in MateMail has any business
# reaching anything else in the engine.
frontend submission
    bind :587
    default_backend submission_upstream

backend submission_upstream
    # The health check speaks SMTP and says goodbye.
    #
    # A plain `check` opens a TCP connection and drops it, which Postfix
    # records as "lost connection after CONNECT" — every fifteen seconds,
    # forever. That is ~5,700 lines a day, and P7 counts those lines as
    # `connection_lost`, a metric whose entire job is to show that clients are
    # failing mid-session. A real failure would have been invisible in the
    # noise. NE6 found it within minutes of the gateway going live.
    #
    # Reading the 220 banner and sending QUIT completes the conversation the
    # way a client should, so the check proves more (Postfix is answering SMTP,
    # not merely accepting sockets) and leaves a clean disconnect in the log.
    option tcp-check
    tcp-check connect
    tcp-check expect rstring ^220
    tcp-check send QUIT\r\n
    tcp-check expect rstring ^221
    server postfix postfix:587 check inter 15s resolvers docker init-addr none

# ── PostBox mailbox access (P11) ────────────────────────────────────────────
#
# WHY THIS LISTENER EXISTS
#   PostBox is MateMail's own webmail, and a webmail application has to read
#   the mail store. Dovecot holds it, and Dovecot is deliberately not on the
#   link network MateMail shares.
#
#   Joining Dovecot to that network would have been one line, and it would
#   have handed the Django application three ports, not one: IMAPS on 993,
#   LMTP on 24 and the doveadm HTTP API on 8080. LMTP accepts mail for any
#   mailbox WITHOUT AUTHENTICATING, so a compromised web application could
#   have injected messages into any customer's inbox; doveadm is the
#   administrative interface. Neither has anything to do with webmail.
#
#   So PostBox reaches Dovecot the same way MateMail reaches Postfix — through
#   this gateway, which offers exactly one more port and nothing else. The
#   count of services on `matemail_engine_link` is unchanged at two, and the
#   property the compose file states is preserved rather than relaxed: the
#   only things MateMail can reach are the ports that authenticate every
#   connection they accept.
#
# STILL MODE TCP
#   Byte forwarding, no TLS termination, no certificate here. Dovecot presents
#   its own `mx.matemail.online` certificate end to end, which is the name this
#   container is aliased to on the link network, so the gateway holds no key
#   and PostBox validates the real server.
frontend imaps
    bind :993
    default_backend imaps_upstream

backend imaps_upstream
    # DELIBERATELY NO `check`.
    #
    # 993 is implicit TLS, so a TCP-level probe is a handshake that is opened
    # and abandoned, which Dovecot records as a disconnected pre-auth session.
    # NE6 learned this on the submission side: a health check that speaks the
    # wrong protocol pollutes the very log the monitoring reads. The submission
    # backend could answer with a real SMTP conversation; there is no
    # equivalent here without terminating TLS, which this container must not
    # do.
    #
    # The cost is that HAProxy always believes Dovecot is up. That is
    # acceptable: with a single upstream there is nothing to fail over to, and
    # a refused connection surfaces to PostBox as the same error either way.
    # HAProxy's own liveness is covered by the `health` frontend above.
    #
    # `init-addr none` lets the gateway start before Dovecot has an address,
    # and `resolvers docker` re-resolves the name afterwards, so recreating
    # Dovecot does not strand this backend on a stale IP.
    server dovecot dovecot:993 resolvers docker init-addr none

# ── PostBox filters (ManageSieve) ────────────────────────────────────────────
#
# This is the existing two-network gateway, NOT a direct app-to-engine link.
# It forwards the authenticated STARTTLS session unchanged; Dovecot presents
# its existing mx.matemail.online certificate end-to-end and the gateway never
# sees the master password. Port 4190 is NEVER published to the host.
frontend managesieve
    bind :4190
    default_backend managesieve_upstream

backend managesieve_upstream
    # A raw TCP probe would create repeated failed pre-auth disconnects, so
    # monitor the gateway process separately using /healthz instead.
    server dovecot dovecot:4190 resolvers docker init-addr none
