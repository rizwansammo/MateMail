# MateMail private engine gateway - TCP passthrough only.
#
# WHY THIS FILE EXISTS
#   MateMail's backend and Celery worker must reach the Mail Engine's API and
#   SMTP submission ports. Publishing those on a host bridge address was tried
#   and rejected: a published bind address selects a destination IP, never a
#   permitted source, so every other Docker network on this host could reach
#   them. This gateway replaces that path. It sits on a dedicated internal
#   network shared only with MateMail's two calling services, and forwards to
#   the engine over the engine's own network. Nothing else can reach it, and no
#   host port is published.
#
# WHY A SEPARATE PROCESS RATHER THAN nginx-mailcow
#   nginx-mailcow's image has the stream module compiled in, but there is no
#   update-safe place to put a stream{} block: the only writable, bind-mounted
#   nginx path is /etc/nginx/conf.d, which upstream includes INSIDE http{}
#   where stream{} is invalid. The one file with a top-level context,
#   nginx.conf.j2, is tracked in mailcow's git and restored by update.sh.
#
# WHY ONE GATEWAY FOR BOTH PROTOCOLS
#   MateMail addresses the engine as mx.matemail.online for both HTTPS and
#   SMTP, and its certificate is issued for that name. Attaching nginx-mailcow
#   and postfix-mailcow to the shared network under the same alias would let
#   Docker's DNS return either address, while 8453 exists only on one and 587
#   only on the other - a routing coin-flip. One ingress owning the name makes
#   the destination deterministic.
#
# MODE TCP, DELIBERATELY
#   This is a layer-4 forwarder. It does not terminate, inspect or re-originate
#   TLS, and it is not an SMTP relay. The certificate MateMail validates is the
#   real one presented by nginx-mailcow and by Postfix - so hostname
#   verification stays meaningful end to end, and this process never holds key
#   material or parses a mail command.

global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode                tcp
    log                 global
    option              tcplog
    option              dontlognull
    timeout connect     10s
    timeout client      5m
    timeout server      5m
    # Mail sessions are long and idle: a client may hold an authenticated
    # submission connection open between messages. Five minutes matches the
    # engine's own patience rather than cutting sessions short at this hop.

# Backends are resolved through Docker's embedded DNS at 127.0.0.11 rather than
# being frozen at startup. Container addresses change whenever the engine stack
# is recreated, and a gateway holding a stale IP would fail in a way that looks
# like the engine being down.
resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries     3
    timeout resolve     1s
    timeout retry       1s
    hold valid          10s
    hold nx             5s
    hold other          5s

# ── Engine API (HTTPS, TLS passed through untouched) ─────────────────────────
frontend engine_api
    bind :8453
    default_backend engine_api_upstream

backend engine_api_upstream
    server nginx nginx-mailcow:8453 check inter 15s resolvers docker init-addr none

# ── SMTP submission (STARTTLS negotiated end to end, not here) ───────────────
frontend engine_submission
    bind :587
    default_backend engine_submission_upstream

backend engine_submission_upstream
    # The health check opens and closes a TCP connection; it never speaks SMTP,
    # so it cannot be mistaken for a delivery attempt.
    server postfix postfix-mailcow:587 check inter 15s resolvers docker init-addr none
