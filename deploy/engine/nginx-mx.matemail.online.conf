# mx.matemail.online — ACME challenge only.
#
# Why this file exists:
#   mx.matemail.online is the MateMail Mail Engine's canonical hostname. Its
#   TLS certificate is issued by the host-native Certbot (mailcow runs with
#   SKIP_LETS_ENCRYPT=y so it never competes for port 80), and Certbot needs an
#   HTTP-01 challenge path reachable on this name.
#
# What it deliberately does NOT do:
#   It does not proxy anything. The Mailcow administration UI and API are
#   private — the UI is reachable only over an SSH tunnel to 127.0.0.1:8453,
#   and the API only from MateMail's own Docker network. Adding a proxy_pass
#   here would make either of them publicly reachable, which is exactly what
#   P4B forbids.
#
#   Any request other than the ACME challenge gets 404. No mail service, admin
#   page or API endpoint is exposed through this vhost.

server {
    listen 80;
    listen [::]:80;
    server_name mx.matemail.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 404;
    }
}
