# RETIRED ARCHIVE - DO NOT INSTALL ON CURRENT MATEMAIL.PRO PRODUCTION.
# This is a historical matemail.online-era Nginx template. Production uses
# /etc/nginx/sites-available/matemail-pro-* and the custom-host provisioner.
# New instructions: docs/DEPLOYMENT.md and docs/ARCHITECTURE.md.

# MateMail PostBox vhost TEMPLATE for MateServer's host-native nginx.
#
# THIS IS A TEMPLATE, and it is the SECOND of two steps.
#
# DO NOT INSTALL THIS FILE BEFORE THE CERTIFICATE EXISTS. nginx resolves
# `ssl_certificate` and the certbot-provided `options-ssl-nginx.conf` when it
# PARSES its configuration, not when a request arrives, so naming a
# certificate certbot has not issued yet makes `nginx -t` fail for the WHOLE
# SERVER — every other MateMail hostname stops reloading with it:
#
#   nginx: [emerg] open() "/etc/letsencrypt/options-ssl-nginx.conf" failed
#   (2: No such file or directory)
#
# certbot cannot run first either: HTTP-01 needs something already answering
# on port 80 for the name. That is what the bootstrap vhost beside this file
# is for. Full reasoning: docs/DEPLOYMENT.md § Certificates and the bootstrap
# order.
#
# The order that works, once postbox.matemail.online resolves:
#
#   # 1. HTTP-only bootstrap vhost, so port 80 answers for this name.
#   sudo cp deploy/nginx/postbox.matemail.online.bootstrap.conf \
#           /etc/nginx/sites-available/matemail-postbox
#   sudo ln -s /etc/nginx/sites-available/matemail-postbox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # 2. Issue the certificate through the existing webroot.
#   sudo certbot certonly --webroot -w /var/www/html -d postbox.matemail.online
#
#   # 3. Overwrite the same path with THIS file and reload. The symlink
#   #    already exists and is not recreated.
#   sudo cp deploy/nginx/postbox.matemail.online.conf \
#           /etc/nginx/sites-available/matemail-postbox
#   sudo nginx -t && sudo systemctl reload nginx
#
# `certonly --webroot` rather than `--nginx`: the nginx plugin rewrites the
# server block it finds, so it would edit a file the next step overwrites and
# leave the installed config quietly different from the one in Git.
#
# RENEWAL depends on the HTTP server block below keeping its
# `/.well-known/acme-challenge/` location. certbot renews with the same
# webroot method that first succeeded, so removing it breaks renewal ninety
# days later — where it presents as an expired certificate rather than as an
# edit.
#
# WHY A THIRD HOSTNAME
#   MateMail has three audiences and they must not share a sign-in page:
#
#     portal.matemail.online    customers administering their organization
#     platform.matemail.online  NetaMate staff running the platform
#     postbox.matemail.online   mailbox users reading their own mail
#
#   A mailbox user is NOT an organization administrator — an employee has a
#   mailbox and usually no Workspace login at all. Putting webmail behind the
#   customer console would imply otherwise, and would put a mailbox password
#   form next to a signup link.
#
# SAME UPSTREAMS, NO NEW PORTS
#   The same Next.js image and the same Django backend on the same loopback
#   ports. Nothing new is published and no firewall change is needed; the split
#   is a Host header, resolved by frontend/middleware.ts, which mounts the
#   /postbox subtree at the root for this hostname.
#
#   The upstream blocks are NOT redefined here — they are declared once in
#   portal.matemail.online.conf, and a second declaration is a "duplicate
#   upstream" error that stops nginx starting.

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
# The ACME challenge needs its own location: certbot's `if ($host = …)` rewrite
# runs in the server rewrite phase, before a location is chosen, so a challenge
# for a name not covered by an `if` would 404 and issuance would fail.
server {
    listen 80;
    listen [::]:80;
    server_name postbox.matemail.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── MateMail PostBox ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name postbox.matemail.online;

    ssl_certificate     /etc/letsencrypt/live/postbox.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postbox.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    #
    # Content-Security-Policy is NOT set here. The Next.js middleware issues a
    # per-request nonce and nginx cannot know it; a second CSP header is
    # enforced as an intersection, so adding one would silently constrain the
    # app under a policy nobody maintains.
    #
    # X-Frame-Options DENY. A webmail client framed by another site is a
    # credential-phishing surface, and nothing legitimately frames PostBox.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # Attachments are uploaded in the compose request body, base64-encoded.
    # Base64 costs about a third, so this sits above POSTBOX_MAX_MESSAGE_MB
    # (25 MB) with room to spare — a message nginx refuses after somebody has
    # typed it is a worse failure than one the application refuses up front.
    client_max_body_size 40m;

    # ── Internal API — denied at the edge ────────────────────────────────────
    # MUST stay above `location /api/`.
    location /api/internal/ {
        deny all;
        return 403;
    }

    # ── API → Django ─────────────────────────────────────────────────────────
    #
    # Same backend as the other two hostnames. Authorization is not done here:
    # /api/postbox/ requires a PostBox session cookie bound to one mailbox, and
    # a Workspace or Platform token is not accepted by it. This vhost is a
    # route, not a security boundary.
    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;

        # Opening a large message or downloading an attachment reads it out of
        # Dovecot first, so this is longer than the app vhost's default.
        proxy_read_timeout     180s;
        proxy_send_timeout     180s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";

        # Attachment downloads stream. Buffering them to disk on the way out
        # adds latency and a spool file for no gain.
        proxy_buffering        off;
    }

    # ── Django admin is NOT exposed here ─────────────────────────────────────
    # It lives on portal.matemail.online/django-admin/. A mailbox user has no
    # business reaching it, and a second route is a second thing to guard.
    location /django-admin/ {
        deny all;
        return 403;
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    # `Host` is forwarded unchanged, which is what lets the middleware serve
    # PostBox at the root of this hostname.
    location / {
        proxy_pass             http://matemail_frontend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
    }
}
