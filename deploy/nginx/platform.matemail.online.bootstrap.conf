# RETIRED ARCHIVE - DO NOT INSTALL ON CURRENT MATEMAIL.PRO PRODUCTION.
# This is a historical matemail.online-era Nginx template. Production uses
# /etc/nginx/sites-available/matemail-pro-* and the custom-host provisioner.
# New instructions: docs/DEPLOYMENT.md and docs/ARCHITECTURE.md.

# MateMail Platform Console — BOOTSTRAP vhost. HTTP only, no TLS. Temporary.
#
# THIS IS FOR A REBUILD, NOT FOR THE CURRENT SERVER.
#   platform.matemail.online is already deployed and its certificate exists, so
#   the real vhost installs there without this file. It is here so that
#   rebuilding MateServer, or standing up a staging host, does not hit the
#   failure below — the template's old instructions would have.
#
# WHY IT EXISTS
#   nginx resolves `ssl_certificate` and `include
#   /etc/letsencrypt/options-ssl-nginx.conf` when it PARSES its configuration,
#   not when a request arrives. Installing the real vhost before certbot has
#   issued the certificate makes `nginx -t` fail for the WHOLE SERVER:
#
#     nginx: [emerg] open() "/etc/letsencrypt/options-ssl-nginx.conf" failed
#     (2: No such file or directory)
#
#   certbot cannot go first either: HTTP-01 needs something already answering
#   on port 80 for the name. This file is that something.
#
#   The reasoning is written out once in docs/DEPLOYMENT.md § "Certificates and
#   the bootstrap order"; every MateMail hostname uses the same pattern.
#
# USE (on a host where platform.matemail.online has no certificate yet)
#   sudo cp deploy/nginx/platform.matemail.online.bootstrap.conf \
#           /etc/nginx/sites-available/matemail-platform
#   sudo ln -s /etc/nginx/sites-available/matemail-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot certonly --webroot -w /var/www/html -d platform.matemail.online
#
#   # then overwrite the SAME path with the real vhost and reload:
#   sudo cp deploy/nginx/platform.matemail.online.conf \
#           /etc/nginx/sites-available/matemail-platform
#   sudo nginx -t && sudo systemctl reload nginx
#
#   Do NOT install this on the live server alongside the real vhost. Two server
#   blocks on :80 for one server_name make nginx use whichever it parsed first
#   and warn about a conflicting name, and here that would mean the Platform
#   Console's HTTP→HTTPS redirect quietly stops happening.

server {
    listen 80;
    listen [::]:80;
    server_name platform.matemail.online;

    # The only thing this vhost serves. `root` puts the challenge file at
    # /var/www/html/.well-known/acme-challenge/<token>, exactly where
    # `certbot --webroot -w /var/www/html` writes it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # NOT a redirect to https://. There is no HTTPS listener for this name yet
    # on a host being rebuilt, so a redirect would send an operator to a
    # refused connection and look like a broken deployment.
    location / {
        return 404;
    }
}
