# MateMail Workspace — BOOTSTRAP vhost. HTTP only, no TLS. Temporary.
#
# THIS IS THE FIRST FILE INSTALLED ON A REBUILT SERVER.
#   The Workspace certificate covers four names, and the real vhost declares
#   the `matemail_backend` / `matemail_frontend` upstreams that PostBox,
#   Platform and Autodiscover all reuse — so a fresh MateServer starts here.
#
#   The current server already has this certificate; this file is for a
#   rebuild or a staging host, where the real vhost's old instructions would
#   have failed.
#
# WHY IT EXISTS
#   nginx resolves `ssl_certificate` and `include
#   /etc/letsencrypt/options-ssl-nginx.conf` when it PARSES its configuration,
#   not when a request arrives. Installing the real vhost before certbot has
#   issued the certificate makes `nginx -t` fail for the WHOLE SERVER:
#
#     nginx: [emerg] open() "/etc/letsencrypt/options-ssl-nginx.conf" failed
#     (2: No such file or directory)
#
#   certbot cannot go first either: HTTP-01 needs something already answering
#   on port 80 for each name. This file is that something.
#
#   The reasoning is written out once in docs/DEPLOYMENT.md § "Certificates and
#   the bootstrap order"; every MateMail hostname uses the same pattern.
#
#   No upstream is declared here, and none is needed: nothing is proxied. That
#   is deliberate — it means this file parses on a server where the MateMail
#   containers are not running yet, which is exactly when it is used.
#
# USE
#   sudo cp deploy/nginx/portal.matemail.online.bootstrap.conf \
#           /etc/nginx/sites-available/matemail
#   sudo ln -s /etc/nginx/sites-available/matemail /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot certonly --webroot -w /var/www/html \
#        -d portal.matemail.online -d matemail.online -d www.matemail.online \
#        -d app.matemail.online
#
#   # then overwrite the SAME path with the real vhost and reload:
#   sudo cp deploy/nginx/portal.matemail.online.conf \
#           /etc/nginx/sites-available/matemail
#   sudo nginx -t && sudo systemctl reload nginx
#
#   All four names go in one certonly call. Issuing them separately produces
#   four certificates where the real vhost expects one, and three of the four
#   server blocks would then point at a file whose SANs do not cover them.

server {
    listen 80;
    listen [::]:80;

    # Every name the Workspace certificate covers. `app.matemail.online` is
    # included because it is the legacy redirect (DEC-055) and stays on the
    # certificate for as long as that redirect exists — a redirect reached only
    # after a certificate warning is worse than a dead name.
    server_name portal.matemail.online matemail.online www.matemail.online
                app.matemail.online;

    # The only thing this vhost serves. `root` puts the challenge file at
    # /var/www/html/.well-known/acme-challenge/<token>, exactly where
    # `certbot --webroot -w /var/www/html` writes it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # NOT a redirect to https://. On a server being built there is no HTTPS
    # listener yet, so a redirect would send the operator to a refused
    # connection and look like a broken deployment rather than an unfinished
    # one.
    location / {
        return 404;
    }
}
