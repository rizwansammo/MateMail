# MateMail vhost TEMPLATE for MateServer's host-native nginx.
#
# THIS IS A TEMPLATE. P2 does not install or modify anything on MateServer.
# An operator installs it deliberately, when P4 makes deployment appropriate:
#
#   sudo cp deploy/nginx/app.matemail.online.conf \
#           /etc/nginx/sites-available/matemail
#   sudo ln -s /etc/nginx/sites-available/matemail /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.matemail.online -d matemail.online
#   sudo nginx -t && sudo systemctl reload nginx
#
# Host-native nginx is the ONLY public reverse proxy for the MateMail SaaS app
# (DEC-011). MateMail must not run a second customer-facing nginx or certbot
# stack. Certificates are managed by the host's existing certbot.
#
# Upstreams are the loopback ports the MateMail compose stack publishes:
#   backend  127.0.0.1:8020
#   frontend 127.0.0.1:3020
# 8015 / 8016 / 3015 belong to MateConnect — do not reference them here.

upstream matemail_backend {
    server 127.0.0.1:8020;
    keepalive 8;
}

upstream matemail_frontend {
    server 127.0.0.1:3020;
    keepalive 8;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.matemail.online matemail.online;

    # Keep the ACME webroot reachable for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.matemail.online$request_uri;
    }
}

# ── Root domain → app subdomain ──────────────────────────────────────────────
# Until the public marketing site exists (P9), matemail.online redirects to the
# control panel. Give it its own server block then rather than editing this one.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matemail.online;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/app.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.matemail.online$request_uri;
}

# ── Control panel ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.matemail.online;

    ssl_certificate     /etc/letsencrypt/live/app.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # Content-Security-Policy.
    #
    # script-src NEEDS 'unsafe-inline' as written. The Next.js App Router emits
    # inline <script> tags carrying the hydration payload (self.__next_f);
    # without it React never hydrates and every page renders as a dead static
    # shell. This was found the hard way in P2.5 — curl cannot detect it,
    # because the HTML and JS chunks all return 200.
    #
    # 'unsafe-inline' for style-src is required by Tailwind's runtime injection.
    #
    # This is genuinely weaker than it looks: 'unsafe-inline' on script-src
    # removes CSP's main protection against injected script. The correct fix is
    # a per-request nonce issued by Next.js middleware, with this header removed
    # so the app sets its own. Scheduled for P3 alongside moving refresh tokens
    # out of localStorage. Do NOT simply delete 'unsafe-inline' here — that
    # breaks the app without replacing the protection.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 25m;

    # ── Internal API — denied at the edge (P1) ───────────────────────────────
    #
    # Everything under /api/internal/ authenticates with INTERNAL_API_SECRET and
    # is for internal callers only: the Mail Engine policy bridge, the webmail
    # front end, and operator health checks. Those reach Django directly on
    # 127.0.0.1:8020 and never traverse this vhost, so a blanket deny is correct.
    #
    # This block MUST stay above `location /api/` — nginx prefix matching takes
    # the longest match, but keeping the order explicit prevents an accident.
    location /api/internal/ {
        deny all;
        return 403;
    }

    # ── API → Django ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
    }

    # ── Django admin ─────────────────────────────────────────────────────────
    #
    # Renamed from /admin/ because that path belongs to the Next.js platform
    # admin portal.
    #
    # TODO (P3): restrict by source address or require VPN. Any is_staff user
    # can sign in here, and P0 only removed the secrets from its forms — it did
    # not restrict who can reach it. Uncomment and set the operator range:
    #   allow 203.0.113.0/24;
    #   deny all;
    location /django-admin/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
    }

    # ── Static files ─────────────────────────────────────────────────────────
    # Served by WhiteNoise from inside the backend image (collected at build
    # time), so there is no shared volume for nginx to read directly.
    location /static/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        expires                1y;
        add_header             Cache-Control "public, immutable";
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    location / {
        proxy_pass             http://matemail_frontend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_read_timeout     60s;
    }
}
