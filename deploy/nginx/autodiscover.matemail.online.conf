# RETIRED ARCHIVE - DO NOT INSTALL ON CURRENT MATEMAIL.PRO PRODUCTION.
# This is a historical matemail.online-era Nginx template. Production uses
# /etc/nginx/sites-available/matemail-pro-* and the custom-host provisioner.
# New instructions: docs/DEPLOYMENT.md and docs/ARCHITECTURE.md.

# MateMail Autodiscover vhost TEMPLATE for MateServer's host-native nginx.
#
# THIS IS A TEMPLATE, and it is the SECOND of two steps.
#
# DO NOT INSTALL THIS FILE FIRST. The `ssl_certificate` lines below are read
# when nginx parses its configuration, not when a request arrives, so naming
# a certificate that certbot has not issued yet makes `nginx -t` fail for the
# WHOLE SERVER:
#
#   nginx: [emerg] cannot load certificate ".../fullchain.pem":
#   BIO_new_file() failed (SSL: ... No such file or directory)
#
# Every other MateMail hostname stops reloading with it. And certbot cannot
# run first either: HTTP-01 needs something already answering on port 80.
#
# The order that works, once the DNS A record for
# autodiscover.matemail.online resolves:
#
#   # 1. HTTP-only bootstrap vhost, so port 80 answers for this name.
#   sudo cp deploy/nginx/autodiscover.matemail.online.bootstrap.conf \
#           /etc/nginx/sites-available/matemail-autodiscover
#   sudo ln -s /etc/nginx/sites-available/matemail-autodiscover \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # 2. Issue the certificate through the existing webroot.
#   sudo certbot certonly --webroot -w /var/www/html \
#        -d autodiscover.matemail.online
#
#   # 3. Replace the bootstrap file with THIS one, at the same path, and
#   #    reload. The symlink already exists and is not recreated.
#   sudo cp deploy/nginx/autodiscover.matemail.online.conf \
#           /etc/nginx/sites-available/matemail-autodiscover
#   sudo nginx -t && sudo systemctl reload nginx
#
# `certonly --webroot` rather than `--nginx`: the nginx plugin rewrites the
# server block it finds, so it would edit a file that step 3 overwrites and
# leave the installed config quietly different from the one in Git.
#
# RENEWAL depends on the HTTP block below keeping its acme-challenge
# location. certbot renews with the same webroot method it first succeeded
# with, so removing that location breaks renewal ninety days later, at which
# point the failure looks like an expired certificate rather than an edit.
#
# WHAT THIS HOST IS FOR
#   One thing: telling a mail client where MateMail's IMAP and submission
#   servers are, on the URL Outlook constructs by itself. Nothing else.
#
#   This vhost is therefore an ALLOW-LIST, not a proxy with some paths denied.
#   Every other vhost in this directory routes `/` to the frontend and blocks
#   what should not be reachable; here the default is 404 and only the
#   Autodiscover paths are passed through. A deny-list on a host that exists
#   for one endpoint is a list somebody has to keep complete forever, and the
#   first thing it misses is a customer console on a hostname nobody is
#   watching.
#
# WHY A SEPARATE HOSTNAME AND NOT A CUSTOMER ONE
#   Customers point an SRV record here rather than a CNAME at their own
#   `autodiscover.<their-domain>`. A CNAME does not make our certificate valid
#   for their name, so a direct HTTPS hostname per customer would mean issuing
#   and renewing a certificate per customer domain. The SRV record moves the
#   TLS identity to a name we already own and can certify once (DEC-057).
#
# TLS IDENTITY
#   This certificate is for the HTTPS discovery service. It is NOT the
#   certificate Postfix and Dovecot present for mx.matemail.online, and the two
#   must not be conflated — mail protocol TLS and this web endpoint are
#   separate identities with separate renewal paths.
#
# UPSTREAMS
#   `matemail_backend` is declared once, in portal.matemail.online.conf. It is
#   deliberately not redeclared here; a second declaration is a "duplicate
#   upstream" error and nginx will not start. The frontend upstream is not
#   referenced at all — no page is served from this hostname.

# ── HTTP: ACME only, everything else to HTTPS ────────────────────────────────
# The challenge keeps its own location, and must keep it: this is the path
# certbot renews through, and it is the one part of this file that was also
# present in the bootstrap vhost.
#
# It is a location rather than a server-level rule because certbot's own
# rewrites use `if ($host = …)` plus a server-level `return 404`, and both run
# in the server rewrite phase — which finishes before a location is chosen. A
# challenge for any name not covered by an `if` would then 404 and renewal
# would fail.
server {
    listen 80;
    listen [::]:80;
    server_name autodiscover.matemail.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the Autodiscover endpoint, and nothing else ───────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name autodiscover.matemail.online;

    ssl_certificate     /etc/letsencrypt/live/autodiscover.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autodiscover.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    #
    # A CSP is set here, unlike the app vhosts, because nothing on this host
    # renders markup — there is no nonce to coordinate with. `default-src
    # 'none'` is the honest policy for a host that only returns XML.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "no-referrer"                                   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # Outlook's request is a few hundred bytes. The application caps the body at
    # 8 KiB; this refuses the absurd cases a hop earlier, before a worker is
    # occupied reading them.
    client_max_body_size 64k;

    # ── The endpoint, in the spellings Outlook actually sends ────────────────
    #
    # `location =` is an exact match, so this cannot widen. The case variants
    # are listed rather than matched with `~*` for the same reason: a
    # case-insensitive regex on a path prefix is one careless edit away from
    # matching more than intended, and this list mirrors exactly what
    # `apps/autodiscover/urls.py` routes.
    location = /autodiscover/autodiscover.xml { proxy_pass http://matemail_backend; }
    location = /Autodiscover/Autodiscover.xml { proxy_pass http://matemail_backend; }
    location = /AutoDiscover/AutoDiscover.xml { proxy_pass http://matemail_backend; }
    location = /autodiscover/Autodiscover.xml { proxy_pass http://matemail_backend; }
    location = /Autodiscover/autodiscover.xml { proxy_pass http://matemail_backend; }

    # Shared by the five exact locations above. `proxy_set_header` is inherited
    # into them because they set no headers of their own.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_read_timeout 20s;

    # ── Everything else does not exist here ──────────────────────────────────
    #
    # The default. The internal API, the platform API, Django admin, the
    # Workspace, PostBox and the Platform Console are all unreachable on this
    # hostname — not because each is denied, but because nothing is passed
    # through that is not named above.
    #
    # 404 rather than 403: this host genuinely has no other resources, and 403
    # would suggest something is there to be authorised for.
    location / {
        return 404;
    }
}
