# RETIRED ARCHIVE - DO NOT INSTALL ON CURRENT MATEMAIL.PRO PRODUCTION.
# This is a historical matemail.online-era Nginx template. Production uses
# /etc/nginx/sites-available/matemail-pro-* and the custom-host provisioner.
# New instructions: docs/DEPLOYMENT.md and docs/ARCHITECTURE.md.

# MateMail Platform Console vhost TEMPLATE for MateServer's host-native nginx.
#
# THIS IS A TEMPLATE. On the CURRENT server the certificate already exists,
# so this file installs directly:
#
#   sudo cp deploy/nginx/platform.matemail.online.conf \
#           /etc/nginx/sites-available/matemail-platform
#   sudo ln -s /etc/nginx/sites-available/matemail-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ON A REBUILT OR STAGING HOST, where it does not, install the bootstrap
# vhost first. The old instructions here said `nginx -t` then
# `certbot --nginx`, which cannot work:
#
# DO NOT INSTALL THIS FILE BEFORE THE CERTIFICATE EXISTS. nginx resolves
# `ssl_certificate` and the certbot-provided `options-ssl-nginx.conf` when it
# PARSES its configuration, not when a request arrives, so naming a
# certificate certbot has not issued yet makes `nginx -t` fail for the WHOLE
# SERVER — every other MateMail hostname stops reloading with it:
#
#   nginx: [emerg] open() "/etc/letsencrypt/options-ssl-nginx.conf" failed
#   (2: No such file or directory)
#
# certbot cannot run first either: HTTP-01 needs something already answering
# on port 80 for the name. That is what the bootstrap vhost beside this file
# is for. Full reasoning: docs/DEPLOYMENT.md § Certificates and the bootstrap
# order.
#
#   # 1. HTTP-only bootstrap vhost, so port 80 answers for this name.
#   sudo cp deploy/nginx/platform.matemail.online.bootstrap.conf \
#           /etc/nginx/sites-available/matemail-platform
#   sudo ln -s /etc/nginx/sites-available/matemail-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # 2. Issue the certificate through the existing webroot.
#   sudo certbot certonly --webroot -w /var/www/html -d platform.matemail.online
#
#   # 3. Overwrite the same path with THIS file and reload.
#   sudo cp deploy/nginx/platform.matemail.online.conf \
#           /etc/nginx/sites-available/matemail-platform
#   sudo nginx -t && sudo systemctl reload nginx
#
# `certonly --webroot` rather than `--nginx`: the nginx plugin rewrites the
# server block it finds, so it would edit a file the next step overwrites and
# leave the installed config quietly different from the one in Git.
#
# RENEWAL depends on the HTTP server block below keeping its
# `/.well-known/acme-challenge/` location. certbot renews with the same
# webroot method that first succeeded, so removing it breaks renewal ninety
# days later — where it presents as an expired certificate rather than as an
# edit.
#
# WHY A SEPARATE HOSTNAME AND NOT A PATH
#   Two audiences that must never share a login page.
#   portal.matemail.online is the MateMail Workspace, where customers sign
#   in and a signup link is appropriate; this hostname is internal NetaMate
#   staff only and carries no signup, no trial call to action and no
#   organization creation (DEC-045, hostname revised by DEC-055).
#
# WHY THE SAME UPSTREAMS
#   It is the same Next.js application and the same Django backend on the same
#   loopback ports. Nothing new is published, no new container runs, and no
#   firewall change is needed — the split is a Host header, resolved by
#   frontend/middleware.ts, which mounts the /platform subtree at the root for
#   this hostname.
#
#   The upstream blocks are NOT redefined here. They are declared once in
#   portal.matemail.online.conf, which nginx loads from the same sites-enabled
#   directory; declaring them twice is a "duplicate upstream" error and nginx
#   will refuse to start.

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
# The ACME challenge gets its own location for the same reason as the app
# vhost: certbot's `if ($host = …)` rewrite runs in the server rewrite phase,
# before a location is chosen, so a challenge for a name not covered by an `if`
# would 404 and issuance would fail. Keep this location-based form.
server {
    listen 80;
    listen [::]:80;
    server_name platform.matemail.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Platform Console ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name platform.matemail.online;

    # certbot fills these in. This hostname gets its own certificate rather
    # than being added to the Workspace's, so that renewing or reissuing
    # either cannot disturb the other.
    ssl_certificate     /etc/letsencrypt/live/platform.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    #
    # Content-Security-Policy is deliberately NOT set here, for the same reason
    # as the app vhost: the Next.js middleware issues a per-request nonce and
    # nginx cannot know it. A second CSP header is enforced as an intersection,
    # so adding one would silently constrain the console under a policy nobody
    # maintains.
    #
    # X-Frame-Options is DENY rather than SAMEORIGIN. Nothing frames this
    # console, and its buttons suspend organizations and disable outbound mail
    # — precisely what clickjacking would want to reach.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # An operations console uploads nothing. Keeping this small closes a
    # request-body surface the console has no use for.
    client_max_body_size 2m;

    # ── Internal API — denied at the edge ────────────────────────────────────
    # Same rule as the app vhost. Internal callers reach Django directly on
    # 127.0.0.1:8020 and never traverse a public vhost, so a blanket deny is
    # correct. MUST stay above `location /api/`.
    location /api/internal/ {
        deny all;
        return 403;
    }

    # ── API → Django ─────────────────────────────────────────────────────────
    # The same backend the Organization Console uses. Authorization is not done
    # here: every /api/platform/ endpoint enforces IsPlatformAdmin, which also
    # refuses an API key even when the key belongs to a member of staff. This
    # vhost is a route, not a security boundary — a customer who sends a
    # request here with a tenant session still gets a 403 from Django.
    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
    }

    # ── Django admin is NOT exposed on this hostname ─────────────────────────
    # It lives on portal.matemail.online/django-admin/ and is operator surface
    # with its own restrictions. Publishing a second route to it here would
    # mean two paths to guard instead of one.
    location /django-admin/ {
        deny all;
        return 403;
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    # `Host` is forwarded unchanged, which is what lets the middleware
    # recognise this hostname and serve the Platform Console. Without it every
    # request here would render the Organization Console.
    location / {
        proxy_pass             http://matemail_frontend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
    }
}
