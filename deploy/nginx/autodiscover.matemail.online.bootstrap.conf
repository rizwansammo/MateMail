# MateMail Autodiscover — BOOTSTRAP vhost. HTTP only, no TLS.
#
# This file exists to solve a chicken-and-egg problem, and it is temporary.
#
# THE PROBLEM
#   `ssl_certificate` is read when nginx parses its configuration, not when a
#   request arrives. So a vhost naming
#   /etc/letsencrypt/live/autodiscover.matemail.online/fullchain.pem before
#   certbot has issued it makes `nginx -t` fail outright:
#
#     nginx: [emerg] cannot load certificate
#     "/etc/letsencrypt/live/autodiscover.matemail.online/fullchain.pem":
#     BIO_new_file() failed (SSL: error:80000002:system library::No such file
#     or directory)
#
#   That is not a failure confined to the new site. `nginx -t` fails for the
#   whole server, and a reload attempted anyway refuses to apply — so a
#   deployment that enabled the final vhost first would take every MateMail
#   hostname down, not just this one.
#
#   certbot cannot issue the certificate first either: HTTP-01 needs a server
#   already answering on port 80 for the name.
#
# THE ORDER THAT WORKS
#   Install THIS file, get a certificate with it, then replace it with the real
#   vhost. Full commands are in docs/DEPLOYMENT.md § Autodiscover deployment.
#
#     sudo cp deploy/nginx/autodiscover.matemail.online.bootstrap.conf \
#             /etc/nginx/sites-available/matemail-autodiscover
#     sudo ln -s /etc/nginx/sites-available/matemail-autodiscover \
#                /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#     sudo certbot certonly --webroot -w /var/www/html \
#          -d autodiscover.matemail.online
#
#     # then overwrite the same path with the final vhost:
#     sudo cp deploy/nginx/autodiscover.matemail.online.conf \
#             /etc/nginx/sites-available/matemail-autodiscover
#     sudo nginx -t && sudo systemctl reload nginx
#
#   `certonly --webroot` rather than `--nginx`: the nginx plugin edits the
#   server block it finds, which would rewrite a file that is about to be
#   replaced and leave the installed config differing from the one in Git.
#   `--webroot` writes a challenge file and touches no configuration.
#
# AFTER THE CERTIFICATE IS ISSUED
#   This file has no further purpose. It is not left enabled alongside the real
#   vhost — two server blocks listening on :80 for the same server_name means
#   nginx uses the first it parsed and warns about a conflicting name, which is
#   a confusing way to discover that ACME renewals are being served by the
#   wrong block.

server {
    listen 80;
    listen [::]:80;
    server_name autodiscover.matemail.online;

    # The only thing this vhost serves. `root` here means the challenge file
    # lands at /var/www/html/.well-known/acme-challenge/<token>, which is
    # exactly where `certbot --webroot -w /var/www/html` writes it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Everything else genuinely is not here yet.
    #
    # NOT a redirect to https://. During bootstrap there is no HTTPS listener
    # for this name, so a redirect would send a client to a connection that is
    # refused — which looks like a broken service rather than one that has not
    # been switched on. 404 is the truth until the real vhost replaces this.
    location / {
        return 404;
    }
}
