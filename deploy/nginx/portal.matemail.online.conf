# MateMail Workspace vhost TEMPLATE for MateServer's host-native nginx.
#
# THIS IS A TEMPLATE. An operator installs it deliberately:
#
#   sudo cp deploy/nginx/portal.matemail.online.conf \
#           /etc/nginx/sites-available/matemail
#   sudo ln -s /etc/nginx/sites-available/matemail /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d portal.matemail.online -d matemail.online \
#                         -d www.matemail.online -d app.matemail.online
#   sudo nginx -t && sudo systemctl reload nginx
#
# RENAMED FROM app.matemail.online
#   `portal.matemail.online` is the MateMail Workspace — the customer surface.
#   `app.matemail.online` was that hostname until P11 and is now a legacy
#   redirect only (the last server block in this file). It answers nothing; it
#   forwards to the same path on the Workspace host. Keep its name on the
#   certificate for as long as the redirect exists, or the redirect is reached
#   only after a certificate warning, which is worse than a dead name.
#
#   The four MateMail hostnames, and what each is:
#     matemail.online           public homepage (not built yet — see below)
#     portal.matemail.online    MateMail Workspace   — customers
#     postbox.matemail.online   MateMail PostBox     — mailbox users
#     platform.matemail.online  Platform Console     — NetaMate staff
#
# Host-native nginx is the ONLY public reverse proxy for the MateMail SaaS app
# (DEC-011). MateMail must not run a second customer-facing nginx or certbot
# stack. Certificates are managed by the host's existing certbot.
#
# Upstreams are the loopback ports the MateMail compose stack publishes:
#   backend  127.0.0.1:8020
#   frontend 127.0.0.1:3020
# 8015 / 8016 / 3015 belong to MateConnect — do not reference them here.
#
# These upstream blocks are declared HERE and only here. The PostBox and
# Platform vhosts reuse them by name; a second declaration is a "duplicate
# upstream" error that stops nginx starting.

upstream matemail_backend {
    server 127.0.0.1:8020;
    keepalive 8;
}

upstream matemail_frontend {
    server 127.0.0.1:3020;
    keepalive 8;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────────────────────
# The ACME challenge MUST be matched by its own location. Certbot's own
# rewrite of this block uses `if ($host = …)` plus a server-level
# `return 404`, and both run in nginx's server rewrite phase — which finishes
# before a location is chosen. A challenge for any name not covered by an `if`
# then 404s, and issuing a certificate for a newly added name fails. Keep this
# location-based form; if certbot rewrites it, restore this shape.
server {
    listen 80;
    listen [::]:80;
    server_name portal.matemail.online matemail.online www.matemail.online
                app.matemail.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Root + www → the Workspace ───────────────────────────────────────────────
# Temporary. `matemail.online` is the public homepage and has not been built;
# until it is, sending people to the Workspace is better than a 404. Kept as
# its own server block so the homepage can replace the body without touching
# anything below.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matemail.online www.matemail.online;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/portal.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://portal.matemail.online$request_uri;
}

# ── MateMail Workspace ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.matemail.online;

    ssl_certificate     /etc/letsencrypt/live/portal.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    #
    # Content-Security-Policy is deliberately NOT set here.
    #
    # As of P3c the Next.js app owns CSP (frontend/middleware.ts). It issues a
    # fresh nonce per request and stamps it onto every script tag it emits,
    # which removed the 'unsafe-inline' that P2.5 had to ship. nginx cannot
    # participate in that: it does not know the nonce, so any policy it wrote
    # would either block the page's own scripts or have to re-admit
    # 'unsafe-inline' and undo the change.
    #
    # A second CSP header is not additive — a browser enforces the intersection
    # of every policy it receives — so setting one here would quietly constrain
    # the app under a policy nobody is maintaining. Do not add one back.
    #
    # The locations below that do NOT proxy to Next.js set their own CSP. They
    # must restate these headers as well: in nginx, an `add_header` inside a
    # `location` replaces the inherited set rather than extending it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    client_max_body_size 25m;

    # ── Internal API — denied at the edge (P1) ───────────────────────────────
    #
    # Everything under /api/internal/ authenticates with INTERNAL_API_SECRET and
    # is for internal callers only: the Mail Engine policy bridge and operator
    # health checks. Those reach Django directly on 127.0.0.1:8020 and never
    # traverse this vhost, so a blanket deny is correct.
    #
    # (It also carried the webmail SSO bridge until P11 removed that — see
    # DEC-049. PostBox authenticates mailbox users directly and uses no
    # internal endpoint.)
    #
    # This block MUST stay above `location /api/` — nginx prefix matching takes
    # the longest match, but keeping the order explicit prevents an accident.
    location /api/internal/ {
        deny all;
        return 403;
    }

    # ── API → Django ─────────────────────────────────────────────────────────
    location /api/ {
        # A JSON API renders nothing. Everything is denied; the browser should
        # never be executing or embedding anything served from here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
    }

    # ── Django admin ─────────────────────────────────────────────────────────
    #
    # Named /django-admin/ rather than /admin/, which belongs to the Next.js
    # routes. This is the only hostname that exposes it; PostBox and the
    # Platform Console both deny the path at the edge.
    #
    # TODO (P3): restrict by source address or require VPN. Any is_staff user
    # can sign in here, and P0 only removed the secrets from its forms — it did
    # not restrict who can reach it. Uncomment and set the operator range:
    #   allow 203.0.113.0/24;
    #   deny all;
    location /django-admin/ {
        # Django's admin ships inline scripts and has no nonce mechanism, so
        # this policy keeps 'unsafe-inline'. It is operator surface, not
        # customer surface, and is additionally gated by the TODO above.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
    }

    # ── Static files ─────────────────────────────────────────────────────────
    # Served by WhiteNoise from inside the backend image (collected at build
    # time), so there is no shared volume for nginx to read directly.
    location /static/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
        expires                1y;

        # This block already set Cache-Control, which under nginx's rules had
        # silently dropped every inherited security header from these
        # responses. They are restated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        add_header             Cache-Control "public, immutable";
    }

    # ── Everything else → Next.js ────────────────────────────────────────────
    #
    # No `add_header` here on purpose. Adding one would drop the inherited
    # security headers, and adding a CSP would collide with the nonce policy
    # the app sets per request. Next.js owns CSP for these responses.
    location / {
        proxy_pass             http://matemail_frontend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_read_timeout     60s;
    }
}

# ── LEGACY: app.matemail.online → the Workspace ──────────────────────────────
#
# This hostname is NOT an application surface. It proxies nothing and serves
# nothing; every request is redirected to the same path on
# `portal.matemail.online`, so an old bookmark or a link in an old email lands
# where it used to rather than on a home page.
#
# 308 rather than 301: a 301 permits a browser to convert POST to GET, which
# would turn a re-submitted sign-in into a confusing GET against the new host.
# 308 preserves the method and body.
#
# frontend/middleware.ts performs the same redirect, so the application is
# correct even where this block has not been installed. nginx doing it first
# means the request never reaches a container.
#
# REMOVING IT LATER: delete this block, drop `app.matemail.online` from the
# port-80 server above and from the certificate, and drop
# NEXT_PUBLIC_LEGACY_WORKSPACE_HOSTS from the frontend build. Check traffic
# first — the access log is the only evidence of who is still using it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.matemail.online;

    ssl_certificate     /etc/letsencrypt/live/portal.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 308 https://portal.matemail.online$request_uri;
}
