# MateMail PostBox — BOOTSTRAP vhost. HTTP only, no TLS. Temporary.
#
# WHY THIS FILE EXISTS
#   nginx resolves `ssl_certificate` and `include
#   /etc/letsencrypt/options-ssl-nginx.conf` when it PARSES its configuration,
#   not when a request arrives. Installing the real vhost before certbot has
#   issued the certificate therefore makes `nginx -t` fail — and it fails for
#   the WHOLE SERVER, so every other MateMail hostname stops reloading with it:
#
#     nginx: [emerg] open() "/etc/letsencrypt/options-ssl-nginx.conf" failed
#     (2: No such file or directory)
#
#   certbot cannot go first either: HTTP-01 needs something already answering
#   on port 80 for the name. This file is that something.
#
#   The same pattern is used for every MateMail hostname. The reasoning is
#   written out once in docs/DEPLOYMENT.md § "Certificates and the bootstrap
#   order".
#
# USE
#   sudo cp deploy/nginx/postbox.matemail.online.bootstrap.conf \
#           /etc/nginx/sites-available/matemail-postbox
#   sudo ln -s /etc/nginx/sites-available/matemail-postbox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot certonly --webroot -w /var/www/html -d postbox.matemail.online
#
#   # then overwrite the SAME path with the real vhost and reload:
#   sudo cp deploy/nginx/postbox.matemail.online.conf \
#           /etc/nginx/sites-available/matemail-postbox
#   sudo nginx -t && sudo systemctl reload nginx
#
#   Overwriting rather than enabling a second file matters: two server blocks
#   listening on :80 for one server_name make nginx use whichever it parsed
#   first and warn about a conflicting name — a confusing way to discover later
#   that renewals are served by the wrong block.

server {
    listen 80;
    listen [::]:80;
    server_name postbox.matemail.online;

    # The only thing this vhost serves. `root` puts the challenge file at
    # /var/www/html/.well-known/acme-challenge/<token>, exactly where
    # `certbot --webroot -w /var/www/html` writes it.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # NOT a redirect to https://. There is no HTTPS listener for this name
    # yet, so a redirect would send people to a refused connection — which
    # looks like a broken service rather than one not yet switched on.
    location / {
        return 404;
    }
}
