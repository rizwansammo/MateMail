# MateMail — LOCAL DEVELOPMENT stack.
#
# This file is for a developer machine only. It builds from source and bind-mounts
# the working tree so edits are picked up without a rebuild.
#
# It is NOT the production configuration and must never be deployed.
# Production is deploy/docker-compose.yml: GHCR images, no build context, no
# bind mounts, copied to /opt/MateMail/ on MateServer. See deploy/README.md.
#
# Usage:
#   cp .env.example .env   # then fill in DJANGO_SECRET_KEY
#   docker compose up -d
#   docker compose run --rm backend python manage.py migrate
#
# Ports match the MateServer allocation so local and production URLs line up:
#   backend  127.0.0.1:8020
#   frontend 127.0.0.1:3020
# 8015 / 8016 / 3015 belong to MateConnect — never use them for MateMail.
#
# The Mail Engine is not part of this stack. MAIL_ENGINE_ADAPTER defaults to
# "stub", an in-memory implementation of the full adapter contract, so local
# development needs no mail infrastructure at all.

name: matemail-dev

x-backend-dev: &backend_dev
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    # Development convenience only. Production mounts no source.
    - ./backend:/app
  environment: &backend_dev_env
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    DATABASE_URL: postgres://${POSTGRES_USER:-matemail}:${POSTGRES_PASSWORD:-matemail}@postgres:5432/${POSTGRES_DB:-matemail}
    REDIS_URL: redis://redis:6379/0
    INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-dev-only-internal-secret}
    MAIL_ENGINE_ADAPTER: ${MAIL_ENGINE_ADAPTER:-stub}
    NATIVE_ENGINE_API_URL: ${NATIVE_ENGINE_API_URL:-}
    NATIVE_ENGINE_API_SECRET: ${NATIVE_ENGINE_API_SECRET:-}
    MAIL_DOMAIN: ${MAIL_DOMAIN:-matemail.online}
    MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mx.matemail.online}
    DKIM_SELECTOR: ${DKIM_SELECTOR:-mm1}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3020}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3020}
    WEBMAIL_BASE_URL: ${WEBMAIL_BASE_URL:-http://localhost:3020}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3020}
    JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
    JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matemail}
      POSTGRES_USER: ${POSTGRES_USER:-matemail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matemail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matemail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    <<: *backend_dev
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8020:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [internal]

  celery-worker:
    <<: *backend_dev
    command: celery -A config worker --loglevel=info --concurrency=2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  celery-beat:
    <<: *backend_dev
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8020}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3020}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8020}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3020}
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:3020:3000"
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
