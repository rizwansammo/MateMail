# MateMail production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs. the base compose:
#   - All backend services run with config.settings.prod (DEBUG=False, HSTS, secure cookies)
#   - Localhost port bindings from the base compose remain — host nginx proxies to them
#   - INTERNAL_API_SECRET and email credentials added to all relevant services

services:

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MateMail <noreply@matemail.online>}
      MAIL_ENGINE_ADAPTER: ${MAIL_ENGINE_ADAPTER:-mailcow}
      MAIL_ENGINE_API_KEY: ${MAIL_ENGINE_API_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-app.matemail.online,matemail.online,localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.matemail.online,https://matemail.online}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.matemail.online}
      APP_BASE_URL: ${APP_BASE_URL:-https://app.matemail.online}

  celery-worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      MAIL_ENGINE_ADAPTER: ${MAIL_ENGINE_ADAPTER:-mailcow}
      MAIL_ENGINE_API_KEY: ${MAIL_ENGINE_API_KEY}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-matemail.online}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mx.matemail.online}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MateMail <noreply@matemail.online>}

  celery-beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  frontend:
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.matemail.online}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.matemail.online}
