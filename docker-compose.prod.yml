# MateMail production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs. the base compose:
#   - All backend services run with config.settings.prod (DEBUG=False, HSTS, secure cookies)
#   - backend and frontend ports are NOT exposed (nginx is the sole ingress)
#   - nginx loads the TLS config and mounts Let's Encrypt certificates
#   - certbot service available for certificate renewal
#   - INTERNAL_API_SECRET propagated to all services that call /api/internal/

services:

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MateMail <noreply@matemail.online>}
      MAIL_ENGINE_ADAPTER: ${MAIL_ENGINE_ADAPTER:-mailcow}
      MAIL_ENGINE_API_KEY: ${MAIL_ENGINE_API_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-matemail.online,app.matemail.online,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://matemail.online,https://app.matemail.online}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.matemail.online}
      APP_BASE_URL: ${APP_BASE_URL:-https://app.matemail.online}
    ports: []

  celery-worker:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      MAIL_ENGINE_ADAPTER: ${MAIL_ENGINE_ADAPTER:-mailcow}
      MAIL_ENGINE_API_KEY: ${MAIL_ENGINE_API_KEY}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-matemail.online}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mx.matemail.online}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-MateMail <noreply@matemail.online>}

  celery-beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

  frontend:
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.matemail.online}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.matemail.online}
    ports: []

  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Single-file mount overrides the conf.d/ directory from the base compose,
      # loading only the TLS config (not the dev HTTP config)
      - ./nginx/conf.d/matemail-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    restart: "no"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
