# CI-only IMAPS authentication against the actual Native SQL verifier.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0
base_dir = /run/dovecot
state_dir = /run/dovecot
protocols = imap
listen = *
default_internal_user = dovecot
default_internal_group = dovecot
default_login_user = dovenull
auth_mechanisms = plain login
auth_allow_cleartext = no
ssl = required
mail_driver = maildir
mail_path = ~/
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000
namespace inbox {
  inbox = yes
}
passdb sql {
  sql_driver = pgsql
  query = SELECT address AS username, password_hash AS password FROM public.dovecot_client_auth('%{user}', '%{password}')
}
userdb static {
  fields {
    mail_home = /var/vmail/%{user | domain}/%{user | username}
  }
}
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
  }
}
!include db-runtime.conf
service auth {
  unix_listener /run/dovecot-auth/auth-client {
    mode = 0660
    user = dovecot
    group = smtpauth
  }
}
doveadm_api_key = ga-test-doveadm-key
service doveadm {
  inet_listener http {
    port = 8080
    ssl = no
  }
}
ssl_server_cert_file = /etc/dovecot/lab.crt
ssl_server_key_file = /etc/dovecot/lab.key
