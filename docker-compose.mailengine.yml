# Mail engine services — logically separate from the MateMail application stack.
#
# This file defines the integration boundary between MateMail and the underlying
# mail engine. MateMail's Django backend communicates with the mail engine only
# through the REST API (MAIL_ENGINE_API_URL in docker-compose.yml).
#
# NEVER expose the mail engine admin panel to customers.
# MateMail's Next.js frontend is the ONLY customer-facing interface.
#
# In production:
#   - Pull the official mailcow repository: https://github.com/mailcow/mailcow-dockerized
#   - Run its docker-compose.yml separately on the same Docker network
#   - Ensure the mailcow containers join the "matemail_external" network below
#     so the backend container can reach mailcow-nginx by hostname
#
# For local development integration testing:
#   docker compose -f docker-compose.yml -f docker-compose.mailengine.yml up
#
# ─────────────────────────────────────────────────────────────────────────────
# STUB — Replace with real mailcow docker-compose in Phase 6
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Placeholder that simulates the mailcow API surface for health checks.
  # Replace with the full mailcow stack in Phase 6.
  mail-engine-stub:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/mailengine-stub.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      - matemail_external

networks:
  matemail_external:
    external: true
    name: matemail_matemail_external
