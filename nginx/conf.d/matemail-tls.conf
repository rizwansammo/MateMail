# MateMail production TLS configuration
# Activated via docker-compose.prod.yml after running scripts/init-letsencrypt.sh
#
# This file is mounted as /etc/nginx/conf.d/default.conf in production,
# replacing the dev HTTP-only config entirely.

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name matemail.online app.matemail.online;

    # ACME challenge passthrough (needed for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.matemail.online$request_uri;
    }
}

# ── Root domain redirect ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name matemail.online;

    ssl_certificate     /etc/letsencrypt/live/matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matemail.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://app.matemail.online$request_uri;
}

# ── Main HTTPS application server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.matemail.online;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matemail.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/matemail.online/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    # ── Request size ──────────────────────────────────────────────────────────
    client_max_body_size 25m;

    # ── Block internal API — nginx enforces this at the edge ──────────────────
    location /api/internal/ {
        deny all;
        return 403;
    }

    # ── API → Django ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass             http://backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_buffering        off;
    }

    # ── Django admin panel (renamed for security — not /admin/ which is Next.js) ──
    location /django-admin/ {
        proxy_pass           http://backend;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto https;
    }

    # ── Static files (WhiteNoise also serves these, but nginx is faster) ──────
    location /static/ {
        alias      /app/staticfiles/;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Platform admin + all other routes → Next.js ───────────────────────────
    location / {
        proxy_pass             http://frontend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_read_timeout     60s;
    }
}
