# MateMail vhost — add to the host nginx
#
# Installation on the VPS:
#   sudo cp /opt/matemail/nginx/matemail-vhost.conf /etc/nginx/sites-available/matemail
#   sudo ln -s /etc/nginx/sites-available/matemail /etc/nginx/sites-enabled/matemail
#   sudo certbot --nginx -d app.matemail.online -d matemail.online
#   sudo nginx -t && sudo nginx -s reload
#
# MateMail services listen on localhost:
#   Backend  → 127.0.0.1:8015  (Django / DRF)
#   Frontend → 127.0.0.1:3015  (Next.js)

upstream matemail_backend {
    server 127.0.0.1:8015;
    keepalive 8;
}

upstream matemail_frontend {
    server 127.0.0.1:3015;
    keepalive 8;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name matemail.online app.matemail.online;

    # ACME challenge (certbot webroot — keep even after cert is issued for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://app.matemail.online$request_uri;
    }
}

# ── Root domain → app subdomain ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name matemail.online;

    # certbot managed — filled in automatically by: certbot --nginx
    ssl_certificate     /etc/letsencrypt/live/app.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://app.matemail.online$request_uri;
}

# ── Main HTTPS application ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.matemail.online;

    # certbot managed
    ssl_certificate     /etc/letsencrypt/live/app.matemail.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.matemail.online/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

    client_max_body_size 25m;

    # ── Block internal API at the edge ────────────────────────────────────────
    location /api/internal/ {
        deny all;
        return 403;
    }

    # ── API → Django backend ──────────────────────────────────────────────────
    location /api/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_read_timeout     120s;
        proxy_http_version     1.1;
        proxy_set_header       Connection        "";
    }

    # ── Django admin panel ────────────────────────────────────────────────────
    location /django-admin/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
    }

    # ── Static files (served by WhiteNoise inside Django) ─────────────────────
    location /static/ {
        proxy_pass             http://matemail_backend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Forwarded-Proto https;
        expires                1y;
        add_header             Cache-Control "public, immutable";
    }

    # ── Everything else → Next.js frontend ───────────────────────────────────
    location / {
        proxy_pass             http://matemail_frontend;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_read_timeout     60s;
    }
}
